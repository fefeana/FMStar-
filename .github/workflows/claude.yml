name: Claude Code Action

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: "المهمة المطلوبة من Claude Code"
        required: true
        default: "ابدأ بالمرحلة A: افحص المستودع بالكامل وأنشئ تقرير التدقيق FMSTAR_AUDIT.md دون إجراء تعديل مدمر."

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: "https://api.omniroute.ai/v1"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ github.event_name == 'workflow_dispatch' && inputs.prompt || '' }}
