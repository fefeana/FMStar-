name: FMStar Remote Command

on:
  issue_comment:
    types: [created]

jobs:
  dispatch-to-server:
    if: github.event.issue.number == 5 && startsWith(github.event.comment.body, '/fmstar')
    runs-on: ubuntu-latest
    steps:
      - name: Forward command to FMStar server
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          PAYLOAD=$(jq -nc --arg repo "fefeana/FMStar-" --argjson issue 5 --arg command "$COMMENT_BODY" '{repo:$repo,issue:$issue,command:$command}')
          curl -fsS -X POST "https://fmstar-backend-v2.onrender.com/api/fmstar/command" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
