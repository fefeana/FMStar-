name: FMStar Remote Command

on:
  issue_comment:
    types: [created]

jobs:
  dispatch-to-server:
    if: github.event.issue.number == 3 && startsWith(github.event.comment.body, '/fmstar')
    runs-on: ubuntu-latest
    steps:
      - name: Forward command to FMStar server
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          PAYLOAD=$(jq -nc \
            --arg prompt "$COMMENT_BODY" \
            --arg repo "fefeana/FMStar-" \
            --argjson issue 3 \
            '{prompt:$prompt,repo:$repo,issue:$issue}')
          curl -sS -m 20 -X POST "https://fmstar-ai-studio.onrender.com/api/v1/studio/generate" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || true
