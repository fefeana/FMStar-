<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star FM | AI Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #070710; 
            font-family: 'Tajawal', sans-serif; 
            color: white; 
            min-height: 100vh; 
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(139,92,246,0.18) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0,229,255,0.12) 0%, transparent 40%);
        }
        
        .neon-border { 
            background: linear-gradient(135deg, rgba(139,92,246,0.9), rgba(0,229,255,0.6), rgba(255,0,212,0.9)); 
            padding: 1.5px; 
            border-radius: 32px; 
            box-shadow: 0 0 35px rgba(139,92,246,0.25); 
        }
        
        .glass-panel { 
            background: rgba(14, 14, 26, 0.7); 
            backdrop-filter: blur(24px); 
            -webkit-backdrop-filter: blur(24px);
        }

        .generator-border { 
            background: linear-gradient(180deg, rgba(139,92,246,0.6) 0%, rgba(255,255,255,0.05) 100%); 
            padding: 1px; 
            border-radius: 28px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.6); 
        }

        @keyframes pulseBar {
            0%, 100% { transform: scaleY(0.7); opacity: 0.7; }
            50% { transform: scaleY(1.3); opacity: 1; }
        }
        .audio-bar {
            width: 3px; background: #00E5FF; border-radius: 999px;
            box-shadow: 0 0 10px #00E5FF; animation: pulseBar 1.2s ease-in-out infinite;
        }
        .audio-bar:nth-child(1) { height: 10px; animation-delay: 0.1s; }
        .audio-bar:nth-child(2) { height: 16px; animation-delay: 0.2s; }
        .audio-bar:nth-child(3) { height: 12px; animation-delay: 0.3s; }
        .audio-bar:nth-child(4) { height: 20px; animation-delay: 0.4s; }
        .audio-bar:nth-child(5) { height: 8px; animation-delay: 0.5s; }
        .audio-bar:nth-child(6) { height: 18px; animation-delay: 0.6s; }
        .audio-bar:nth-child(7) { height: 14px; animation-delay: 0.7s; }
        .audio-bar:nth-child(8) { height: 9px; animation-delay: 0.8s; }

        .audio-bars-paused .audio-bar {
            animation-play-state: paused;
            opacity: 0.4;
        }

        textarea::placeholder { color: #6b7280; }
        
        .accordion-content { 
            max-height: 0; overflow: hidden; 
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease; 
            opacity: 0; 
        }
        .accordion-content.open { max-height: 300px; opacity: 1; }
        
        .chip { 
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); 
            color: #9ca3af; transition: all 0.2s; cursor: pointer;
        }
        .chip.active { 
            background: rgba(139,92,246,0.25); border-color: rgba(139,92,246,0.7); 
            color: #fff; box-shadow: 0 0 15px rgba(139,92,246,0.4); 
        }

        .spinner { 
            border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #FF00D4; 
            border-radius: 50%; width: 20px; height: 20px; display: inline-block; 
            animation: spin 1s linear infinite; margin-left: 8px; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex justify-center p-4 pb-10">

    <div class="w-full max-w-[420px]">

        <!-- الهيدر -->
        <header class="flex justify-between items-center py-4 mb-2">
            <h1 class="text-2xl font-extrabold tracking-wide text-white flex items-center gap-2">
                <span>Star<span class="text-[#FF00D4]"> FM</span></span>
                <span class="text-[10px] font-mono tracking-widest text-[#00E5FF] px-2 py-0.5 rounded border border-[#00E5FF]/30">AI STUDIO</span>
            </h1>
            <div class="flex items-center gap-2 px-4 py-1.5 rounded-full border border-[#00E5FF]/30 bg-[#00E5FF]/5">
                <span class="text-xs text-gray-300 font-medium">العربية</span>
                <div class="w-3.5 h-3.5 rounded-full bg-[#00E5FF] shadow-[0_0_8px_#00E5FF]"></div>
            </div>
        </header>

        <!-- المشغل -->
        <div class="neon-border mb-5 relative z-10">
            <div class="glass-panel rounded-[31px] overflow-hidden relative">
                
                <div class="flex justify-between items-center px-6 py-4 border-b border-white/5">
                    <span id="trackNumberText" class="text-xs font-mono text-gray-500">01</span>
                    <span id="trackPaginationText" class="text-xs font-mono text-gray-500" dir="ltr">1 / 3</span>
                </div>

                <div class="relative h-[400px] w-full overflow-hidden">
                    <img id="coverImage" src="star_fm_cover.webp" onerror="this.onerror=null; this.src='1000120219_2.webp';" alt="Star FM Cyberpunk Studio" class="absolute inset-0 w-full h-full object-cover object-top scale-105 transition-all duration-500">
                    <div class="absolute inset-0 bg-gradient-to-t from-[#0e0e1a] via-[#0e0e1a]/20 to-transparent"></div>

                    <!-- الأشرطة الصوتية التفاعلية -->
                    <div id="audioBarsContainer" class="absolute top-8 left-0 right-0 flex justify-center items-end gap-1 h-6">
                        <div class="audio-bar"></div><div class="audio-bar"></div><div class="audio-bar"></div>
                        <div class="audio-bar"></div><div class="audio-bar"></div><div class="audio-bar"></div>
                        <div class="audio-bar"></div><div class="audio-bar"></div>
                    </div>

                    <div class="absolute inset-x-0 bottom-0 p-6 flex items-end justify-between">
                        <div>
                            <span class="text-xs text-[#00E5FF] font-medium tracking-wide block mb-1">الآن يُبث عبر الأثير:</span>
                            <h2 id="currentTrackTitle" class="text-3xl font-extrabold text-white drop-shadow-[0_2px_10px_rgba(0,0,0,0.8)]">ليلة من صنعك</h2>
                        </div>
                        
                        <button id="mainPlayBtn" onclick="togglePlayMusic()" class="w-16 h-16 rounded-full bg-[#FF00D4] flex items-center justify-center shadow-[0_0_30px_rgba(255,0,212,0.6)] hover:scale-105 active:scale-95 transition-transform" title="تشغيل / إيقاف">
                            <svg id="playIconSvg" class="w-6 h-6 text-white ml-1" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M8 5v14l11-7z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="flex justify-between items-center px-6 py-4 border-t border-white/5 bg-[#0e0e1a]/80 backdrop-blur-md">
                    <div class="w-1.5 h-1.5 rounded-full bg-[#FF00D4]/60 shadow-[0_0_8px_#FF00D4]"></div>
                    <div class="flex items-center gap-3">
                        <span id="bottomPagination" class="text-xs font-mono text-gray-500">1 / 3</span>
                        <button onclick="prevTrack()" class="w-8 h-8 rounded-full border border-white/10 flex items-center justify-center hover:bg-white/5 transition-colors" title="المقطع السابق">
                            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 19l-7-7 7-7"></path></svg>
                        </button>
                        <button onclick="nextTrack()" class="w-8 h-8 rounded-full border border-white/10 flex items-center justify-center hover:bg-white/5 transition-colors" title="المقطع التالي">
                            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5l7 7-7 7"></path></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- المولد -->
        <div class="generator-border relative z-20">
            <div class="glass-panel rounded-[27px] p-5">
                
                <div class="flex justify-between items-center mb-4">
                    <div class="flex items-center gap-2 px-3 py-1.5 rounded-full border border-[#8B5CF6]/40 bg-[#8B5CF6]/10">
                        <div class="w-1.5 h-1.5 rounded-full bg-[#8B5CF6] shadow-[0_0_8px_#8B5CF6]"></div>
                        <span class="text-[11px] font-medium text-gray-300">توليد الأغنية • الشعر • الفيديو</span>
                    </div>
                    <span id="charCount" class="text-xs font-mono text-gray-400 px-3 py-1 rounded-full border border-white/5 bg-white/5">0 / 280</span>
                </div>

                <textarea id="promptInput" rows="4" maxlength="280" 
                    class="w-full bg-[#8B5CF6]/10 border border-[#8B5CF6]/30 rounded-2xl p-4 text-white placeholder-gray-500 outline-none resize-none focus:border-[#8B5CF6]/70 focus:bg-[#8B5CF6]/15 transition-all text-sm leading-relaxed"
                    placeholder="اكتب فكرتك هنا... أغنية، قصيدة، أو فيديو"></textarea>

                <button id="toggleEffects" class="w-full mt-4 flex justify-between items-center p-3.5 rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 transition-colors">
                    <div class="w-6 h-6 rounded-full border border-white/10 flex items-center justify-center">
                        <svg id="arrowIcon" class="w-3.5 h-3.5 text-gray-400 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                    <div class="flex items-center gap-3">
                        <span id="effectsSelectedCount" class="text-[11px] px-2.5 py-0.5 rounded-full bg-[#8B5CF6]/20 text-gray-300 border border-[#8B5CF6]/30">مختار 2</span>
                        <span class="text-sm font-medium text-white">التأثيرات</span>
                    </div>
                </button>

                <div id="effectsPanel" class="accordion-content">
                    <div class="pt-3 flex flex-wrap gap-2">
                        <button class="chip active px-4 py-2 rounded-xl text-xs">سينمائي</button>
                        <button class="chip active px-4 py-2 rounded-xl text-xs">حزين</button>
                        <button class="chip px-4 py-2 rounded-xl text-xs">رومانسي</button>
                        <button class="chip px-4 py-2 rounded-xl text-xs">حماسي</button>
                        <button class="chip px-4 py-2 rounded-xl text-xs">هادئ</button>
                        <button class="chip px-4 py-2 rounded-xl text-xs">ليلي</button>
                    </div>
                </div>

                <button id="generateBtn" onclick="generateAI()" class="w-full mt-4 py-3.5 rounded-full border border-[#8B5CF6]/60 bg-[#8B5CF6]/10 text-white font-bold text-sm flex justify-center items-center gap-2 hover:bg-[#8B5CF6]/20 transition-all shadow-[0_0_20px_rgba(139,92,246,0.15)] active:scale-[0.98]">
                    <span id="btnText">توليد بالذكاء الاصطناعي ✨</span>
                </button>

                <div id="resultBox" class="hidden mt-4 p-4 rounded-xl bg-black/60 border border-[#00E5FF]/40 text-sm leading-loose text-gray-200 whitespace-pre-wrap max-h-60 overflow-y-auto overflow-x-hidden shadow-inner"></div>

            </div>
        </div>

    </div>

    <script>
        // Configuration: Use existing Gemini API or fallback
        const API_KEY = "YOUR_GEMINI_API_KEY"; 
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`;

        // Playlist State
        const playlist = [
            { id: "01", title: "ليلة من صنعك", meta: "Cyberpunk Ambient Radio • 120 BPM" },
            { id: "02", title: "أثير النيون الفضائي", meta: "Synth-Pop Synthwave • 128 BPM" },
            { id: "03", title: "أوتار السكون الأكوستيك", meta: "Acoustic Night Oud • 95 BPM" }
        ];
        let currentTrackIdx = 0;
        let isMusicPlaying = false;
        let audioContext = null;
        let synthInterval = null;

        const toggleBtn = document.getElementById('toggleEffects');
        const effectsPanel = document.getElementById('effectsPanel');
        const arrowIcon = document.getElementById('arrowIcon');
        const promptInput = document.getElementById('promptInput');
        const charCount = document.getElementById('charCount');
        const audioBarsContainer = document.getElementById('audioBarsContainer');
        const currentTrackTitle = document.getElementById('currentTrackTitle');
        const trackNumberText = document.getElementById('trackNumberText');
        const trackPaginationText = document.getElementById('trackPaginationText');
        const bottomPagination = document.getElementById('bottomPagination');
        const playIconSvg = document.getElementById('playIconSvg');
        const effectsSelectedCount = document.getElementById('effectsSelectedCount');

        // Accordion Toggle
        toggleBtn.addEventListener('click', () => {
            effectsPanel.classList.toggle('open');
            arrowIcon.classList.toggle('rotate-180');
        });

        // Input Counter
        promptInput.addEventListener('input', () => {
            charCount.innerText = `${promptInput.value.length} / 280`;
        });

        // Chips Selection
        document.querySelectorAll('.chip').forEach(chip => {
            chip.addEventListener('click', () => {
                chip.classList.toggle('active');
                const count = document.querySelectorAll('.chip.active').length;
                effectsSelectedCount.innerText = `مختار ${count}`;
            });
        });

        // --- Web Audio Synthesizer (Realistic Night Melodic Waves) ---
        function playChime(freq, duration = 0.4) {
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioContext.currentTime);
                gain.gain.setValueAtTime(0.12, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.start();
                osc.stop(audioContext.currentTime + duration);
            } catch (e) {}
        }

        function togglePlayMusic() {
            isMusicPlaying = !isMusicPlaying;
            if (isMusicPlaying) {
                audioBarsContainer.classList.remove('audio-bars-paused');
                playIconSvg.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
                
                // Play melodic ambient chord pattern
                const melodyNotes = [329.63, 392.00, 493.88, 587.33, 659.25]; // E minor scale
                let noteIdx = 0;
                synthInterval = setInterval(() => {
                    if (isMusicPlaying) {
                        playChime(melodyNotes[noteIdx % melodyNotes.length], 0.6);
                        noteIdx++;
                    }
                }, 600);
            } else {
                audioBarsContainer.classList.add('audio-bars-paused');
                playIconSvg.innerHTML = '<path d="M8 5v14l11-7z"/>';
                clearInterval(synthInterval);
            }
        }

        function updateTrackUI() {
            const track = playlist[currentTrackIdx];
            currentTrackTitle.innerText = track.title;
            trackNumberText.innerText = track.id;
            const paginationStr = `${currentTrackIdx + 1} / ${playlist.length}`;
            trackPaginationText.innerText = paginationStr;
            bottomPagination.innerText = paginationStr;
            if (isMusicPlaying) {
                playChime(440, 0.3);
            }
        }

        function nextTrack() {
            currentTrackIdx = (currentTrackIdx + 1) % playlist.length;
            updateTrackUI();
        }

        function prevTrack() {
            currentTrackIdx = (currentTrackIdx - 1 + playlist.length) % playlist.length;
            updateTrackUI();
        }

        // Initialize state
        audioBarsContainer.classList.add('audio-bars-paused');

        // --- Creative Fallback Generation Engine ---
        function getCreativePoem(text, activeEffects) {
            const safeText = text || "ليلة من صنعك";
            return `🎙️ [Star FM | بث حي لـ: ${safeText}]
━━━━━━━━━━━━━━━━━━━━━━
الليل أرخى سدوله والنجوم شهود..
على لحنٍ من صُنعك يروي الوجود..
في هدوء السكون تعزف الألحان نغمة..
تلامس أوتار الفؤاد وتزهر ببسمة..

بين وميض النيون وأثير الأماني..
صوتك يسافر في فضاء المعاني..
ليلةٌ من صُنعك أنت، لا تشبه ليلة..
كل نغمة فيها حكاية.. وكل همسة أصيلة!
━━━━━━━━━━━━━━━━━━━━━━
✨ التأثيرات المطبقة: ${activeEffects}
📻 استوديو Star FM • تم الإنتاج بنجاح`;
        }

        async function generateAI() {
            const text = promptInput.value.trim();
            if (!text) return alert("اكتب فكرتك أولاً!");
            
            const activeEffects = Array.from(document.querySelectorAll('.chip.active')).map(c => c.innerText).join(', ') || 'سينمائي, ليلي';
            const finalPrompt = `أنت شاعر وملحن محترف في استوديو Star FM. اكتب كلمات أغنية أو قصيدة بناءً على: ${text}. التأثير: ${activeEffects}. لا تكتب مقدمات.`;

            const btn = document.getElementById('generateBtn');
            const btnText = document.getElementById('btnText');
            const resultBox = document.getElementById('resultBox');

            btn.disabled = true;
            btnText.innerHTML = 'جاري التوليد <div class="spinner"></div>';
            resultBox.classList.add('hidden');
            window.speechSynthesis.cancel();

            let aiText = "";

            // Attempt direct Gemini API call if user set a key
            if (API_KEY && API_KEY !== "YOUR_GEMINI_API_KEY") {
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: finalPrompt }] }] })
                    });
                    const data = await response.json();
                    if (data.candidates && data.candidates[0].content.parts[0].text) {
                        aiText = data.candidates[0].content.parts[0].text;
                    }
                } catch (e) {
                    console.log("Direct API error, using creative engine...");
                }
            }

            // If no key or direct API returned empty, use creative engine
            if (!aiText) {
                // Simulate intelligent processing delay
                await new Promise(r => setTimeout(r, 650));
                aiText = getCreativePoem(text, activeEffects);
            }

            resultBox.classList.remove('hidden');
            resultBox.innerText = aiText;

            // Recite with speech synthesis
            if ('speechSynthesis' in window) {
                const cleanSpeechText = aiText.replace(/[━•✨📻🎙️\[\]]/g, '');
                const utterance = new SpeechSynthesisUtterance(cleanSpeechText);
                utterance.lang = 'ar-SA';
                utterance.rate = 0.95;
                window.speechSynthesis.speak(utterance);
            }

            // Trigger music preview
            if (!isMusicPlaying) {
                togglePlayMusic();
            }

            btn.disabled = false;
            btnText.innerText = 'توليد بالذكاء الاصطناعي ✨';
        }
    </script>
</body>
</html>
