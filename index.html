<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star FM | AI Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #090d16 60%, #030712);
            color: #f3f4f6;
            overflow-x: hidden;
        }
        .cyber-frame {
            position: relative;
            border-radius: 1.75rem;
            padding: 1.5px;
            background: linear-gradient(145deg, rgba(34, 211, 238, 0.5), rgba(168, 85, 247, 0.25), rgba(236, 72, 153, 0.75));
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(236, 72, 153, 0.15);
        }
        .glass-inner {
            background: rgba(13, 17, 30, 0.72);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border-radius: calc(1.75rem - 1.5px);
        }
        .glass-panel {
            background: rgba(17, 24, 39, 0.45);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(168, 85, 247, 0.25);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 relative" x-data="{ prompt: '', charCount: 0, isPlaying: true }">

    <!-- الهيدر العلوي -->
    <header class="w-full max-w-md flex justify-between items-center mb-5 z-10 px-1 pt-1">
        <div class="flex items-center gap-2">
            <h1 class="text-xl font-black tracking-wide text-white">Star <span class="text-pink-500">FM</span></h1>
            <span class="text-[10px] tracking-widest text-cyan-400 font-bold border border-cyan-400/30 bg-cyan-950/40 px-2.5 py-1 rounded-lg">AI STUDIO</span>
        </div>
        <div class="flex items-center gap-2 bg-white/5 px-3.5 py-1.5 rounded-full border border-cyan-400/25 backdrop-blur-md">
            <span class="text-xs text-gray-200 font-semibold">العربية</span>
            <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 shadow-[0_0_10px_#22d3ee]"></span>
        </div>
    </header>

    <!-- بطاقة الاستوديو السينمائية -->
    <div class="w-full max-w-md cyber-frame mb-4 z-10">
        <div class="glass-inner p-3.5">
            <div class="flex justify-between items-center text-[11px] text-gray-400 px-1 pb-2.5 font-mono">
                <span>3 / 1</span>
                <span>01</span>
            </div>

            <!-- نافذة الاستوديو وصورة المذيعة -->
            <div class="relative h-64 rounded-2xl overflow-hidden shadow-2xl">
                <img src="https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?q=80&w=1000&auto=format&fit=crop" 
                     alt="Star FM Studio" 
                     class="w-full h-full object-cover object-center">
                
                <div class="absolute inset-0 bg-gradient-to-t from-[#090d16] via-[#090d16]/30 to-transparent"></div>

                <div class="absolute bottom-4 left-4 right-4 flex items-end justify-between">
                    <div>
                        <span class="text-[11px] text-cyan-400 font-bold block mb-0.5">الآن يُبث عبر الأثير</span>
                        <h2 class="text-2xl font-black text-white drop-shadow-[0_2px_10px_rgba(0,0,0,0.8)]">ليلة من صنعك</h2>
                    </div>
                    <button @click="isPlaying = !isPlaying" class="w-14 h-14 rounded-full bg-gradient-to-tr from-pink-600 to-fuchsia-500 flex items-center justify-center text-white shadow-[0_0_25px_rgba(236,72,153,0.7)] transform hover:scale-105 active:scale-95 transition-all">
                        <svg x-show="!isPlaying" class="w-6 h-6 fill-current translate-x-0.5" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        <svg x-show="isPlaying" class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                </div>
            </div>

            <div class="flex justify-between items-center mt-3.5 px-1">
                <div class="flex items-center gap-2.5">
                    <button class="w-8 h-8 rounded-full border border-white/15 bg-white/5 flex items-center justify-center text-gray-300 hover:border-pink-500/50 transition">‹</button>
                    <button class="w-8 h-8 rounded-full border border-white/15 bg-white/5 flex items-center justify-center text-gray-300 hover:border-pink-500/50 transition">›</button>
                    <span class="text-xs text-gray-400 font-mono mr-1">1 / 3</span>
                </div>
                <span class="w-2 h-2 rounded-full bg-pink-500 shadow-[0_0_8px_#ec4899]"></span>
            </div>
        </div>
    </div>

    <!-- صندوق الإدخال الموحد وزر التوليد -->
    <div class="w-full max-w-md glass-panel rounded-3xl p-4 z-10">
        <div class="flex justify-between items-center mb-3 px-1">
            <span class="text-[11px] text-gray-400 font-mono" x-text="charCount + ' / 280'"></span>
            <div class="flex items-center gap-2 bg-purple-950/50 border border-purple-400/25 px-3 py-1 rounded-full">
                <span class="text-[11px] text-purple-200 font-semibold">توليد الأغنية • الشعر • الفيديو</span>
                <span class="w-1.5 h-1.5 rounded-full bg-purple-400"></span>
            </div>
        </div>

        <div class="relative mb-3">
            <textarea 
                x-model="prompt" 
                @input="charCount = prompt.length"
                maxlength="280"
                rows="3" 
                class="w-full bg-[#090d16]/70 border border-white/10 rounded-2xl p-3.5 text-sm text-white placeholder-gray-400 focus:outline-none focus:border-pink-500 transition-all resize-none"
                placeholder="اكتب فكرتك هنا..."></textarea>
        </div>

        <button class="w-full py-3.5 bg-gradient-to-r from-amber-500 via-pink-600 to-purple-600 hover:opacity-95 text-white font-bold text-sm rounded-2xl shadow-lg shadow-pink-600/30 flex items-center justify-center gap-2 transform active:scale-95 transition-all">
            <span>✨ توليد بالذكاء الاصطناعي</span>
        </button>
    </div>

</body>
    </html>
