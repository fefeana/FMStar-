<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FMStar AI Studio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #030712;
            color: #ffffff;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        /* خلفية الاستوديو الفاخرة المطابقة للصورة */
        .studio-bg {
            background: linear-gradient(to bottom, rgba(3, 7, 18, 0.7), rgba(3, 7, 18, 0.9)),
                        url('https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* الكارت الهولوغرامي الزجاجي الشفاف تماماً مثل الصورة */
        .hologram-card {
            background: rgba(8, 15, 30, 0.55);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(56, 189, 248, 0.35);
            box-shadow: 0 0 60px rgba(0, 149, 255, 0.2),
                        inset 0 0 25px rgba(56, 189, 248, 0.15);
            border-radius: 32px;
        }

        .brand-title {
            font-family: 'Cinzel', serif;
            letter-spacing: 2px;
        }

        .glow-text-gold {
            text-shadow: 0 0 15px rgba(234, 179, 8, 0.7);
        }
        
        .glow-text-cyan {
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
        }

        .btn-generate {
            background: linear-gradient(90deg, #d97706 0%, #f59e0b 45%, #0284c7 100%);
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.5), 0 0 20px rgba(2, 132, 199, 0.5);
            transition: all 0.4s ease;
        }

        .btn-generate:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 0 40px rgba(245, 158, 11, 0.8), 0 0 30px rgba(2, 132, 199, 0.8);
        }

        /* الأيقونات الجانبية العائمة المطابقة لصورتك */
        .side-action-btn {
            background: rgba(10, 20, 40, 0.6);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(56, 189, 248, 0.25);
            transition: all 0.3s ease;
        }
        .side-action-btn:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: rgba(56, 189, 248, 0.6);
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(3, 7, 18, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.3);
            border-radius: 10px;
        }
    </style>
</head>
<body class="studio-bg min-h-screen flex flex-col justify-between items-center relative selection:bg-cyan-500 selection:text-black">

    <!-- إضاءة خلفية نيونية منسابة -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[700px] h-[350px] bg-cyan-500/15 blur-[140px] pointer-events-none rounded-full"></div>
    <div class="absolute top-12 left-1/2 -translate-x-1/2 w-[350px] h-[180px] bg-amber-500/20 blur-[100px] pointer-events-none rounded-full"></div>

    <!-- الهيدر العلوي -->
    <header class="w-full max-w-7xl px-6 py-6 flex justify-between items-center z-20">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full border border-amber-400/60 bg-gradient-to-tr from-amber-500/30 to-cyan-500/30 flex items-center justify-center shadow-lg shadow-amber-500/20">
                <i data-lucide="sparkles" class="w-5 h-5 text-amber-400"></i>
            </div>
            <span class="text-xs text-slate-200 font-bold tracking-wider">FMStar Creator</span>
        </div>
        <div class="flex items-center gap-4">
            <button class="p-2.5 rounded-full bg-slate-900/70 border border-slate-700/60 text-slate-300 hover:text-cyan-400 hover:border-cyan-500/60 transition-all">
                <i data-lucide="search" class="w-4 h-4"></i>
            </button>
            <div class="w-10 h-10 rounded-full overflow-hidden border-2 border-amber-400 shadow-md shadow-amber-500/20 p-0.5">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=250&auto=format&fit=crop" alt="User Avatar" class="w-full h-full object-cover rounded-full">
            </div>
        </div>
    </header>

    <!-- الهيكل الرئيسي والواجهة الزجاجية المركزية -->
    <main class="w-full max-w-xl px-4 py-2 z-10 my-auto relative flex items-center justify-center">
        
        <!-- الأيقونات الجانبية العائمة على يمين الكارت -->
        <div class="absolute -right-16 md:-right-20 top-1/2 -translate-y-1/2 hidden sm:flex flex-col gap-3 z-20">
            <button class="side-action-btn p-3 rounded-2xl text-cyan-300 shadow-lg group relative" title="Insights">
                <i data-lucide="zap" class="w-5 h-5 group-hover:scale-110 transition-transform"></i>
            </button>
            <button class="side-action-btn p-3 rounded-2xl text-amber-400 shadow-lg group relative" title="Pro Studio">
                <i data-lucide="gem" class="w-5 h-5 group-hover:scale-110 transition-transform"></i>
            </button>
            <button class="side-action-btn p-3 rounded-2xl text-cyan-400 shadow-lg group relative" title="AI Core">
                <i data-lucide="cpu" class="w-5 h-5 group-hover:scale-110 transition-transform"></i>
            </button>
            <button class="side-action-btn p-3 rounded-2xl text-slate-300 shadow-lg group relative" title="Security">
                <i data-lucide="shield-check" class="w-5 h-5 group-hover:scale-110 transition-transform"></i>
            </button>
        </div>

        <!-- الكارت الهولوغرامي الرئيسي -->
        <div class="hologram-card p-6 md:p-8 relative overflow-hidden w-full">
            
            <!-- الشعار العلوي داخل الكارت -->
            <div class="text-center mb-5">
                <div class="inline-flex flex-col items-center justify-center">
                    <div class="relative">
                        <i data-lucide="star" class="w-12 h-12 text-amber-400 fill-amber-400/30 glow-text-gold"></i>
                        <i data-lucide="sparkle" class="w-5 h-5 text-cyan-400 absolute -top-1 -right-1 animate-pulse"></i>
                    </div>
                    <h1 class="brand-title text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-amber-400 to-amber-100 tracking-wider mt-1 glow-text-gold">
                        FMStar
                    </h1>
                    <p class="text-[10px] tracking-[0.35em] font-bold text-amber-300/90 uppercase">AI STUDIO</p>
                </div>
                <p class="text-[10px] tracking-[0.2em] text-cyan-300/90 font-medium uppercase mt-1.5 glow-text-cyan">
                    WHERE CREATIVITY MEETS A HIGHER INTELLIGENCE
                </p>
            </div>

            <!-- عبارة الإلهام المركزية -->
            <div class="text-center mb-6 bg-slate-950/30 py-3 px-4 rounded-2xl border border-cyan-500/20">
                <h2 class="brand-title text-xs md:text-sm font-bold tracking-wide text-cyan-100 uppercase">
                    IF YOU CAN IMAGINE IT
                </h2>
                <h2 class="brand-title text-xs md:text-sm font-extrabold tracking-wide text-amber-400 uppercase glow-text-gold my-0.5">
                    AI CAN CREATE IT
                </h2>
                <p class="text-[8px] tracking-[0.3em] font-bold text-slate-400 uppercase">ONLY PASSION</p>
            </div>

            <form id="generationForm" class="space-y-4">
                
                <!-- قائمة اختيار الأداة -->
                <div class="relative">
                    <label class="block text-xs font-medium text-slate-300 mb-1.5 flex items-center justify-between">
                        <span class="flex items-center gap-2">
                            <i data-lucide="layers" class="w-4 h-4 text-cyan-400"></i>
                            Select AI Creation Tool
                        </span>
                    </label>
                    <div class="relative">
                        <select id="aiTool" class="w-full bg-slate-950/80 border border-cyan-500/40 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400/60 appearance-none transition-all cursor-pointer">
                            <option value="video" selected>🎥 Video Generation</option>
                            <option value="music">🎵 Music Generation</option>
                            <option value="song">🎙️ Song Creation</option>
                            <option value="poetry">✍️ Poetry Creation</option>
                            <option value="melody">🎼 Melody Composer</option>
                            <option value="director">🎬 AI Director</option>
                            <option value="image">🖼️ Image Generator</option>
                            <option value="voice">🗣️ Voice Creator</option>
                            <option value="story">📖 Story Generator</option>
                            <option value="assistant">🤖 AI Assistant</option>
                        </select>
                        <i data-lucide="chevron-down" class="w-4 h-4 text-cyan-400 absolute left-4 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                    </div>
                </div>

                <!-- صندوق الوصف -->
                <div class="relative">
                    <textarea id="promptInput" rows="3" placeholder="Describe your imagination...

Examples: A cinematic video of a girl in a futuristic city... A romantic song... A motivational poem..." 
                    class="w-full bg-slate-950/80 border border-cyan-500/40 rounded-xl p-4 text-xs md:text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400/60 resize-none transition-all dir-auto"></textarea>
                    
                    <div class="flex justify-between items-center mt-2 px-1 text-slate-400 text-[11px]">
                        <button type="button" class="flex items-center gap-1.5 hover:text-cyan-400 transition-colors">
                            <i data-lucide="paperclip" class="w-3.5 h-3.5"></i>
                            <span>Attach</span>
                        </button>
                        <div class="flex items-center gap-2">
                            <span id="charCount">0/4000</span>
                            <i data-lucide="sparkles" class="w-3.5 h-3.5 text-amber-400"></i>
                        </div>
                    </div>
                </div>

                <!-- زر التوليد السحري -->
                <div class="pt-1">
                    <button type="submit" class="btn-generate w-full py-3.5 rounded-full font-bold text-sm tracking-wider text-white flex items-center justify-center gap-3 cursor-pointer group">
                        <i data-lucide="sparkles" class="w-4 h-4 text-amber-200 group-hover:rotate-12 transition-transform"></i>
                        <span class="uppercase tracking-widest text-xs md:text-sm">Generate Now</span>
                        <i data-lucide="arrow-right" class="w-4 h-4 text-white group-hover:translate-x-1 transition-transform"></i>
                    </button>
                    <div class="flex justify-between items-center text-[9px] tracking-[0.25em] font-semibold text-slate-400 uppercase mt-2 px-4">
                        <span>FAST</span>
                        <span>•</span>
                        <span>POWERFUL</span>
                        <span>•</span>
                        <span>LIMITLESS</span>
                    </div>
                </div>

            </form>
        </div>

    </main>

    <!-- الفوتر السفلي -->
    <footer class="w-full py-4 text-center z-10 border-t border-slate-900/60 bg-slate-950/50 backdrop-blur-md">
        <p class="brand-title text-[10px] tracking-[0.25em] text-slate-400 uppercase">
            FMStar AI Studio
        </p>
        <p class="text-[9px] text-slate-500 tracking-wider mt-0.5">
            DUBAI • NEW YORK • TOKYO • FOR A BRIGHTER TOMORROW
        </p>
    </footer>

    <!-- السكربتات ونهاية الملف السليمة -->
    <script>
        lucide.createIcons();

        const promptInput = document.getElementById('promptInput');
        const charCount = document.getElementById('charCount');

        promptInput.addEventListener('input', (e) => {
            const count = e.target.value.length;
            charCount.textContent = `${count}/4000`;
        });

        document.getElementById('generationForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const tool = document.getElementById('aiTool').value;
            const prompt = promptInput.value;

            if(!prompt.trim()) {
                alert('لطفاً اكتبي الوصف الإبداعي أولاً ✨');
                return;
            }

            alert(`جاري تشغيل محرك FMStar AI بنجاح! 🚀\nالأداة: ${tool}\nالوصف: ${prompt}`);
        });
    </script>
</body>
                            </html>
