<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FMStar AI Studio | Where Creativity Meets Higher Intelligence</title>
    
    <!-- Tailwind CSS & Alpine.js & Google Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Cinzel:wght@600;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at top center, #0f172a 0%, #030712 60%, #000000 100%);
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .font-brand { font-family: 'Cinzel', serif; }
        
        /* تأثير الزجاج الشفاف العاكس للألوان من كل اتجاه (Omni-Glassmorphism) */
        .glass-panel-omni {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(15, 23, 42, 0.45) 100%);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 
                        inset 0 0 25px rgba(245, 158, 11, 0.15),
                        inset 0 0 10px rgba(56, 189, 248, 0.2);
        }

        .glass-input-box {
            background: rgba(3, 7, 18, 0.55);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(245, 158, 11, 0.35);
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5);
        }

        .gold-neon-btn {
            background: linear-gradient(135deg, #38BDF8 0%, #F59E0B 50%, #FBBF24 100%);
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.6), 0 0 15px rgba(56, 189, 248, 0.4);
            transition: all 0.4s ease;
        }
        .gold-neon-btn:hover {
            box-shadow: 0 0 50px rgba(245, 158, 11, 0.9), 0 0 25px rgba(56, 189, 248, 0.8);
            transform: translateY(-2px);
        }
    </style>
</head>
<body x-data="fmStarStudio()" x-init="initApp()" class="flex flex-col min-h-screen">

    <!-- الشريط العلوي الشفاف -->
    <header class="glass-panel-omni border-b border-amber-500/20 px-6 py-4 flex items-center justify-between mx-4 mt-4 rounded-2xl">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-amber-500 to-yellow-200 flex items-center justify-center shadow-lg shadow-amber-500/40">
                <i data-lucide="star" class="text-slate-950 w-6 h-6 fill-current"></i>
            </div>
            <div>
                <h1 class="font-brand text-xl font-bold tracking-wider text-amber-400">FMStar <span class="text-xs text-sky-400 font-sans">AI STUDIO</span></h1>
                <p class="text-[9px] text-slate-300 tracking-widest">WHERE CREATIVITY MEETS HIGHER INTELLIGENCE</p>
            </div>
        </div>
        <div class="text-[11px] text-amber-300 font-semibold bg-amber-500/10 px-4 py-1.5 rounded-full border border-amber-500/30 backdrop-blur-md">
            ✨ ONLY PASSION • LIMITLESS
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-center">

        <!-- صندوق الإنشاء الشفاف الموحد (اليسار) -->
        <section class="lg:col-span-6 glass-panel-omni rounded-3xl p-6 md:p-8 space-y-6">
            <div class="text-center space-y-2">
                <h2 class="font-brand text-2xl md:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-amber-400 to-sky-300">
                    IF YOU CAN IMAGINE IT, AI CAN CREATE IT
                </h2>
                <p class="text-xs text-slate-300">اكتب وصفك بحرية تامة: فيديو سينمائي، أغنية خاصة، أو لحن شرقي أصيل...</p>
            </div>

            <!-- صندوق الوصف الشفاف -->
            <div class="glass-input-box rounded-2xl p-4 space-y-3">
                <label class="block text-xs text-amber-300 font-semibold flex items-center gap-2">
                    <i data-lucide="sparkles" class="w-4 h-4 text-amber-400"></i> صف خيالك الإبداعي (Describe your imagination...)
                </label>
                <textarea x-model="promptText" rows="5" placeholder="مثال: فيديو قصير لمشهد ليلي في دبي مع أغنية هادئة ومقام الحجاز..." class="w-full bg-transparent border-none text-sm text-white focus:outline-none resize-none placeholder-slate-500 leading-relaxed"></textarea>
                
                <div class="flex items-center justify-between border-t border-slate-700/40 pt-3 text-xs text-slate-400">
                    <button class="flex items-center gap-1.5 hover:text-amber-300 transition">
                        <i data-lucide="paperclip" class="w-3.5 h-3.5"></i> Attach File
                    </button>
                    <span x-text="promptText.length + '/4000'"></span>
                </div>
            </div>

            <!-- زر التوليد الذهبي/الأزرق الوحيد -->
            <button @click="generateMasterpiece()" :disabled="isGenerating"
                    class="w-full gold-neon-btn text-slate-950 font-extrabold py-4 rounded-2xl flex items-center justify-center gap-3 text-base cursor-pointer">
                <i data-lucide="wand-2" class="w-5 h-5"></i>
                <span x-text="isGenerating ? 'جاري تصيير العمل الفني المتكامل...' : 'Generate Now ✨'"></span>
            </button>
        </section>

        <!-- مربع العرض والإخراج (اليمين) -->
        <section class="lg:col-span-6 glass-panel-omni rounded-3xl p-6 md:p-8 space-y-5 min-h-[460px] flex flex-col justify-between">
            <div class="flex items-center justify-between border-b border-white/10 pb-3">
                <span class="text-xs font-bold text-sky-300 flex items-center gap-2">
                    <i data-lucide="play-circle" class="w-4 h-4 text-amber-400"></i> شاشة العرض السينمائية المباشرة
                </span>
                <span class="text-[10px] bg-sky-500/20 text-sky-200 px-3 py-1 rounded-full border border-sky-400/30">Universal Output</span>
            </div>

            <!-- حالة الانتظار -->
            <template x-if="!hasResult && !isGenerating">
                <div class="flex-1 flex flex-col items-center justify-center text-center p-8 space-y-3">
                    <div class="w-16 h-16 rounded-full bg-sky-500/10 border border-sky-400/30 flex items-center justify-center text-sky-300 shadow-xl backdrop-blur-md">
                        <i data-lucide="video" class="w-8 h-8"></i>
                    </div>
                    <p class="text-sm font-semibold text-slate-200">شاشة العرض في انتظار وصفك الإبداعي</p>
                    <p class="text-xs text-slate-400">اكتب فكرتك واضغط Generate Now لتشاهد النتيجة المدمجة هنا</p>
                </div>
            </template>

            <!-- مؤشر التحميل -->
            <template x-if="isGenerating">
                <div class="flex-1 flex flex-col items-center justify-center text-center p-8 space-y-4">
                    <div class="w-12 h-12 rounded-full border-4 border-amber-400 border-t-transparent animate-spin"></div>
                    <p class="text-sm font-bold text-amber-300">جاري دمج الفيديو، الأغنية، والألحان بناءً على وصفك...</p>
                </div>
            </template>

            <!-- ظهور النتيجة النهائية -->
            <template x-if="hasResult && !isGenerating">
                <div class="space-y-4 flex-1 flex flex-col justify-between animate-fadeIn">
                    <div class="relative rounded-2xl overflow-hidden bg-slate-950/80 border border-sky-400/40 aspect-video flex items-center justify-center group shadow-2xl backdrop-blur-md">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-transparent opacity-80"></div>
                        <div class="w-14 h-14 rounded-full bg-amber-400 text-slate-950 flex items-center justify-center shadow-xl cursor-pointer transform group-hover:scale-110 transition">
                            <i data-lucide="play" class="w-6 h-6 fill-current ml-0.5"></i>
                        </div>
                        <div class="absolute bottom-3 right-3 left-3 flex items-center justify-between text-xs text-slate-200">
                            <span class="font-bold text-amber-300">تحفة FMStar السينمائية</span>
                            <span class="bg-black/60 px-2.5 py-0.5 rounded text-[10px]">03:45 min</span>
                        </div>
                    </div>

                    <div class="glass-input-box rounded-2xl p-4 text-xs text-slate-200 space-y-2">
                        <p class="font-bold text-amber-300">📝 تفاصيل العمل المولد:</p>
                        <p class="whitespace-pre-line leading-relaxed" x-text="resultText"></p>
                    </div>

                    <div class="flex gap-3 pt-2">
                        <button @click="copyOutput()" class="flex-1 py-3 rounded-xl bg-white/10 hover:bg-white/20 text-white text-xs font-semibold flex items-center justify-center gap-2 transition backdrop-blur-md border border-white/15">
                            <i data-lucide="copy" class="w-3.5 h-3.5"></i> نسخ المحتوى
                        </button>
                        <button @click="alert('تم حفظ العمل في (إبداعاتي) بنجاح!')" class="flex-1 py-3 rounded-xl bg-amber-500/20 border border-amber-400/40 text-amber-300 text-xs font-semibold flex items-center justify-center gap-2 hover:bg-amber-500/30 transition backdrop-blur-md">
                            <i data-lucide="folder-heart" class="w-3.5 h-3.5"></i> حفظ الإبداع
                        </button>
                    </div>
                </div>
            </template>
        </section>

    </main>

    <!-- الفوتر -->
    <footer class="text-center py-4 text-[10px] text-slate-400 border-t border-white/5 mx-4 mb-2">
        DUBAI • NEW YORK • TOKYO • FOR A BRIGHTER TOMORROW
    </footer>

    <script>
        function fmStarStudio() {
            return {
                promptText: '',
                isGenerating: false,
                hasResult: false,
                resultText: '',
                initApp() {
                    lucide.createIcons();
                },
                generateMasterpiece() {
                    if (!this.promptText.trim()) {
                        alert('يرجى كتابة فكرتك أولاً في مربع الوصف.');
                        return;
                    }
                    this.isGenerating = true;
                    this.hasResult = false;
                    
                    setTimeout(() => {
                        this.isGenerating = false;
                        this.hasResult = true;
                        this.resultText = `بناءً على وصفك الراقي:\n" ${this.promptText} "\n\nتم إنتاج العمل السينمائي المتكامل مع الأغنية والمقام الموسيقي بنجاح عبر محرك FMStar Omni-Root ✨`;
                        setTimeout(() => lucide.createIcons(), 50);
                    }, 1800);
                },
                copyOutput() {
                    navigator.clipboard.writeText(this.resultText);
                    alert('تم نسخ المحتوى بنجاح!');
                }
            }
        }
    </script>
</body>
</html>
