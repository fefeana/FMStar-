<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star FM | AI Studio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Cairo Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #05020a; }
        
        /* تأثير النيون */
        .neon-text { text-shadow: 0 0 10px rgba(168, 85, 247, 0.8), 0 0 20px rgba(168, 85, 247, 0.4); }
        .neon-border { box-shadow: 0 0 15px rgba(168, 85, 247, 0.3), inset 0 0 20px rgba(168, 85, 247, 0.1); }
        .neon-btn { box-shadow: 0 0 20px rgba(236, 72, 153, 0.6); }
        
        /* شريط التمرير */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a0514; }
        ::-webkit-scrollbar-thumb { background: #a855f7; border-radius: 10px; }

        .glass-panel {
            background: rgba(26, 16, 37, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(168, 85, 247, 0.3);
        }
    </style>
</head>
<body class="text-white min-h-screen relative overflow-x-hidden selection:bg-pink-500 selection:text-white">

    <!-- خلفية المدينة المستقبلية -->
    <div class="fixed inset-0 z-0 opacity-40">
        <img src="https://images.unsplash.com/photo-1512453979798-5ea266f8880c?q=80&w=2070&auto=format&fit=crop" class="w-full h-full object-cover" alt="City Background">
    </div>
    <div class="fixed inset-0 bg-gradient-to-b from-[#05020a]/80 via-[#05020a]/60 to-[#05020a] z-0"></div>

    <!-- المحتوى الرئيسي -->
    <div class="relative z-10 flex flex-col items-center w-full max-w-lg mx-auto p-4 pt-8 pb-20">
        
        <!-- الشعار -->
        <div class="flex items-center justify-between w-full mb-8">
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 bg-cyan-400 rounded-full animate-pulse shadow-[0_0_10px_#22d3ee]"></div>
                <span class="text-sm text-gray-300">العربية</span>
            </div>
            <div class="flex items-center gap-2 text-2xl font-bold">
                <span class="text-cyan-400 text-sm border border-cyan-400/50 px-2 py-0.5 rounded">AI STUDIO</span>
                <span class="text-white">Star <span class="text-pink-500">FM</span></span>
            </div>
        </div>

        <!-- مشغل الفيديو/الاستوديو -->
        <div class="w-full glass-panel rounded-3xl p-1.5 mb-6 neon-border relative">
            <div class="relative w-full h-64 rounded-2xl overflow-hidden">
                <!-- صورة الاستوديو -->
                <img src="https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?q=80&w=2070&auto=format&fit=crop" class="w-full h-full object-cover opacity-80" alt="Radio Studio">
                
                <!-- تدرج لوني فوق الصورة -->
                <div class="absolute inset-0 bg-gradient-to-t from-[#05020a] via-transparent to-transparent"></div>
                
                <!-- نصوص فوق الصورة -->
                <div class="absolute bottom-4 right-4 text-right">
                    <p class="text-cyan-400 text-xs font-bold mb-1">الآن بث مباشر عبر الأثير</p>
                    <h2 class="text-3xl font-black text-white leading-tight drop-shadow-lg">أثير الستوديو<br>الفضائي</h2>
                </div>
                
                <!-- زرار التشغيل -->
                <div class="absolute bottom-4 left-4">
                    <button class="w-14 h-14 bg-pink-500 rounded-full flex items-center justify-center shadow-[0_0_20px_rgba(236,72,153,0.8)] hover:scale-105 transition-transform">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="white" class="ml-1"><path d="M8 5v14l11-7z"/></svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- صندوق الإدخال -->
        <div class="w-full glass-panel rounded-3xl p-5 shadow-2xl">
            
            <!-- اختيار النوع -->
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-2 bg-[#0a0514]/80 border border-purple-500/30 px-3 py-1.5 rounded-lg text-xs text-purple-300">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
                    <span>توليد الأغنية • الشعر • الفيديو</span>
                </div>
                <span class="text-xs text-gray-400" id="charCount">0 / 280</span>
            </div>

            <!-- مربع الكتابة -->
            <textarea 
                id="promptInput"
                class="w-full h-24 bg-[#0a0514]/50 border border-purple-500/20 rounded-xl p-3 text-sm text-white placeholder-gray-500 outline-none focus:border-pink-500 transition-colors resize-none"
                placeholder="اكتب فكرتك هنا... أغنية، قصيدة، أو فيديو"
                maxlength="280"
            ></textarea>

            <!-- التأثيرات -->
            <div class="mt-4">
                <div class="flex items-center gap-2 mb-2">
                    <span class="text-xs text-gray-300">التأثيرات</span>
                    <span class="text-[10px] bg-purple-600/30 text-purple-300 px-2 py-0.5 rounded-full">2 مختار</span>
                </div>
                <div class="flex flex-wrap gap-2">
                    <button class="px-4 py-1.5 rounded-lg text-xs border bg-purple-600/40 border-purple-400 text-white shadow-[0_0_10px_rgba(168,85,247,0.3)]">سينمائي</button>
                    <button class="px-4 py-1.5 rounded-lg text-xs border bg-purple-600/40 border-purple-400 text-white shadow-[0_0_10px_rgba(168,85,247,0.3)]">حزين</button>
                    <button class="px-4 py-1.5 rounded-lg text-xs border bg-transparent border-gray-600 text-gray-400 hover:border-purple-500">رومانسي</button>
                    <button class="px-4 py-1.5 rounded-lg text-xs border bg-transparent border-gray-600 text-gray-400 hover:border-purple-500">حماسي</button>
                </div>
            </div>

            <!-- زر التوليد -->
            <button 
                id="generateBtn"
                class="mt-5 w-full bg-gradient-to-r from-purple-600 to-pink-500 hover:from-purple-500 hover:to-pink-400 text-white font-bold py-3.5 rounded-xl neon-btn transition-all flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed text-lg"
            >
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="animate-pulse"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
                <span id="btnText">✨ توليد بالذكاء الاصطناعي</span>
            </button>

            <!-- مكان عرض النتيجة -->
            <div id="resultContainer" class="mt-4 hidden">
                <div class="bg-[#0a0514]/90 border border-purple-500/40 rounded-xl p-4 text-center">
                    <h3 class="text-purple-400 text-xs mb-2 font-bold" id="modelUsed"></h3>
                    <p class="text-white text-sm whitespace-pre-wrap leading-relaxed max-h-60 overflow-y-auto" id="lyricsText"></p>
                </div>
            </div>

        </div>
    </div>

    <!-- كود الربط بالسيرفر -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const generateBtn = document.getElementById('generateBtn');
            const promptInput = document.getElementById('promptInput');
            const btnText = document.getElementById('btnText');
            const resultContainer = document.getElementById('resultContainer');
            const lyricsText = document.getElementById('lyricsText');
            const modelUsed = document.getElementById('modelUsed');
            const charCount = document.getElementById('charCount');

            // تحديث عداد الحروف
            promptInput.addEventListener('input', () => {
                charCount.textContent = `${promptInput.value.length} / 280`;
            });

            // ⚠️ الرابط الثابت بتاع Render
            const API_BASE_URL = "https://fmstar-backend-v2.onrender.com";
            const API_KEY = "samurai_secret_2026";

            // 🚀 كود الصحوة (Wake-up Ping) عشان نصحّي السيرفر
            fetch(API_BASE_URL + '/')
                .then(() => console.log("✅ السيرفر صحي وجاهز!"))
                .catch(() => console.log("⏳ جاري إيقاظ السيرفر من النوم..."));

            // حدث الضغط على الزر
            generateBtn.addEventListener('click', async (e) => {
                e.preventDefault();
                const text = promptInput.value.trim();
                if (!text) return alert("اكتب فكرتك هنا أولاً...");

                // تغيير شكل الزر
                btnText.innerHTML = "⏳ جاري التوليد...";
                generateBtn.disabled = true;
                resultContainer.classList.add('hidden');

                try {
                    const res = await fetch(`${API_BASE_URL}/v1/audio/generations`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-FMStar-Key': API_KEY
                        },
                        body: JSON.stringify({
                            prompt: text,
                            ratio: "16:9",
                            dsp_profile: "cinematic"
                        })
                    });

                    const data = await res.json();

                    if (res.ok) {
                        resultContainer.classList.remove('hidden');
                        modelUsed.textContent = `المحرك: ${data.model_used || 'OmniRoute AI'}`;
                        lyricsText.textContent = data.optimized_prompt || 'تم التوليد بنجاح!';
                    } else {
                        alert("خطأ من السيرفر: " + (data.detail || "مشكلة غير معروفة"));
                    }
                } catch (error) {
                    console.error(error);
                    alert("السيرفر بيصحى من النوم، استني 50 ثانية كمان وجربي تاني.");
                } finally {
                    btnText.innerHTML = "✨ توليد بالذكاء الاصطناعي";
                    generateBtn.disabled = false;
                }
            });
        });
    </script>
</body>
                        </html>
