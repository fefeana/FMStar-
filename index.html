<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FMStar AI - The Creative Realm</title>
    
    <!-- 🛡️ حماية ميتا -->
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #020205; 
            --glass-bg: rgba(15, 15, 20, 0.65); 
            --primary-blue: #3b82f6;
            --neon-blue: #00d4ff; 
            --gold-primary: #D4AF37;
            --text-main: #f8fafc;
            --text-muted: #a1a1aa;
            --radius-lg: 16px;
            --radius-md: 10px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 110px; /* مساحة للزر السفلي */
            position: relative;
            overflow-x: hidden;
        }

        /* 🌌 خلفية السماء والنجوم */
        .star-sky {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            background: radial-gradient(circle at 50% 0%, #0d1025 0%, #020205 70%);
        }
        .star {
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            opacity: 0;
            animation: twinkle infinite alternate;
        }
        .golden-dust {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }
        .dust-particle {
            position: absolute;
            bottom: -10px;
            background: var(--gold-primary);
            border-radius: 50%;
            box-shadow: 0 0 10px 2px rgba(212, 175, 55, 0.6);
            animation: floatUp linear infinite;
        }
        @keyframes twinkle { 0% { opacity: 0.2; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.2); } }
        @keyframes floatUp { 0% { transform: translateY(0) translateX(0); opacity: 0; } 10% { opacity: 0.8; } 90% { opacity: 0.8; } 100% { transform: translateY(-100vh) translateX(30px); opacity: 0; } }

        /* 🏷️ الهيدر */
        .header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            z-index: 10;
        }

        .logo { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 20px; color: #fff; }
        .logo-icon { font-size: 16px; color: var(--gold-primary); }

        .login-btn {
            background: rgba(0, 0, 0, 0.5);
            color: var(--text-main);
            border: 1px solid var(--neon-blue);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }

        /* 📦 المحتوى الرئيسي */
        .main-container {
            width: 100%;
            max-width: 600px;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 12px; /* تقليل المسافة بين المربعات */
            z-index: 10;
        }

        /* 💎 المربع العلوي (تم تصغيره وضبطه) */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 212, 255, 0.15);
            border-radius: var(--radius-lg);
            padding: 16px; /* مساحة داخلية أقل */
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        }

        .hero-title {
            font-size: 24px; /* خط أصغر شوية */
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 6px;
            text-align: center;
            letter-spacing: -0.5px;
            background: linear-gradient(180deg, #ffffff 0%, #fcf6ba 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero-title span { color: var(--gold-primary); -webkit-text-fill-color: var(--gold-primary); }

        .hero-desc {
            color: var(--text-muted);
            font-size: 12px;
            margin-bottom: 14px;
            text-align: center;
            line-height: 1.4;
        }

        /* 🛠️ نموذج الإدخال */
        .input-group { margin-bottom: 10px; }
        .input-label { font-size: 11px; font-weight: 600; margin-bottom: 4px; display: block; }

        .select-wrapper { position: relative; width: 100%; }
        .select-wrapper::after {
            content: '▼'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 8px; pointer-events: none;
        }

        .custom-select, .custom-textarea {
            width: 100%; background: rgba(0, 0, 0, 0.6); border: 1px solid #27272a; border-radius: var(--radius-md);
            padding: 10px; color: var(--text-main); font-family: 'Inter', sans-serif; font-size: 12px; outline: none; transition: 0.3s; scroll-margin-bottom: 120px;
        }
        .custom-select { appearance: none; -webkit-appearance: none; padding-left: 30px; cursor: pointer; }
        .custom-select:focus, .custom-textarea:focus { border-color: var(--neon-blue); box-shadow: 0 0 8px rgba(0, 212, 255, 0.2); }
        
        /* تصغير مساحة الكتابة عشان المربع ميبقاش طويل */
        .custom-textarea { resize: none; height: 65px; }

        /* 📱 شبكة الأدوات (المربعات السفلية) */
        .tools-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px; /* مسافة أقل بين المربعات */
            margin-top: 2px;
        }

        /* تصغير مربعات الأدوات */
        .tool-card {
            background: rgba(18, 18, 22, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid #27272a;
            border-radius: var(--radius-md); /* حواف أقل حدة */
            padding: 10px; /* مساحة داخلية صغيرة */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 80px; /* طول صغير وناسق */
            cursor: pointer;
            transition: 0.2s;
        }
        .tool-card:hover { border-color: var(--gold-primary); box-shadow: 0 0 10px rgba(212, 175, 55, 0.2); }

        .tool-icon { font-size: 16px; margin-bottom: 2px; }
        .tool-title { font-weight: 700; font-size: 11px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; color: #fff; }
        .badge { font-size: 7px; background: var(--gold-primary); color: #000; padding: 1px 4px; border-radius: 3px; font-weight: 800; }
        .badge.blue { background: var(--neon-blue); }
        .tool-desc { color: var(--text-muted); font-size: 9px; line-height: 1.2; }

        /* 🔵 الزر السفلي الثابت */
        .fixed-bottom {
            position: fixed; bottom: 0; left: 0; right: 0; background: rgba(5, 5, 7, 0.9);
            backdrop-filter: blur(20px); padding: 10px 16px; border-top: 1px solid rgba(212, 175, 55, 0.2);
            display: flex; justify-content: center; z-index: 100;
        }

        .btn-generate {
            width: 100%; max-width: 568px; background: var(--primary-blue); color: white; border: 1px solid rgba(255,255,255,0.1);
            padding: 12px; border-radius: var(--radius-md); font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 700;
            cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }
        .btn-generate:hover { background: #2563eb; }
    </style>
</head>
<body>

    <!-- سماء الليل والغبار الذهبي -->
    <div class="star-sky" id="starSky"></div>
    <div class="golden-dust" id="goldenDust"></div>

    <!-- الهيدر -->
    <header class="header">
        <div class="logo"><span class="logo-icon">✦</span> FMStar</div>
        <button class="login-btn">Log in</button>
    </header>

    <!-- المحتوى -->
    <main class="main-container">
        
        <!-- المربع العلوي (أصغر وأكثر تناسقاً) -->
        <div class="glass-card">
            <h1 class="hero-title">ENTER THE <span>CREATIVE</span><br>REALM</h1>
            <p class="hero-desc">Every top AI model in one studio. Turn your imagination into reality.</p>
            
            <div class="input-group">
                <label class="input-label">Select AI Creation Tool</label>
                <div class="select-wrapper">
                    <select class="custom-select">
                        <option>🎬 Video Generation (Seedance 2.5)</option>
                        <option>🎵 Music Generation (Kling 3.0)</option>
                        <option>🎙️ Vibe Voice (Microsoft MIT)</option>
                        <option>📜 Poetry Creation (Gemini)</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">Describe your imagination</label>
                <textarea class="custom-textarea" placeholder="Example: A cinematic video of a poet..."></textarea>
            </div>
        </div>

        <!-- شبكة الأدوات (المربعات السفلية أصغر حجماً) -->
        <div class="tools-grid">
            <div class="tool-card">
                <div>
                    <div class="tool-icon">🎬</div>
                    <div class="tool-title">Video Gen <span class="badge blue">TOP</span></div>
                </div>
                <div class="tool-desc">Most advanced video model</div>
            </div>
            <div class="tool-card">
                <div>
                    <div class="tool-icon">🎙️</div>
                    <div class="tool-title">Vibe Voice <span class="badge">NEW</span></div>
                </div>
                <div class="tool-desc">Microsoft's open-source</div>
            </div>
            <div class="tool-card">
                <div>
                    <div class="tool-icon">📜</div>
                    <div class="tool-title">Poetry Engine</div>
                </div>
                <div class="tool-desc">Poems in 17 dialects</div>
            </div>
            <div class="tool-card">
                <div>
                    <div class="tool-icon">🎵</div>
                    <div class="tool-title">Music Studio</div>
                </div>
                <div class="tool-desc">Create hit songs</div>
            </div>
        </div>

    </main>

    <!-- الزر السفلي الثابت -->
    <div class="fixed-bottom">
        <button class="btn-generate" onclick="generateAI()">
            ✨ Generate Now
        </button>
    </div>

    <script>
        // كود النجوم والغبار
        const starSky = document.getElementById('starSky');
        for (let i = 0; i < 40; i++) {
            const star = document.createElement('div'); star.className = 'star';
            star.style.width = `${Math.random() * 2 + 1}px`; star.style.height = star.style.width;
            star.style.top = `${Math.random() * 100}%`; star.style.left = `${Math.random() * 100}%`;
            star.style.animationDuration = `${Math.random() * 2 + 1}s`; star.style.animationDelay = `${Math.random() * 2}s`;
            starSky.appendChild(star);
        }
        const goldenDust = document.getElementById('goldenDust');
        for (let i = 0; i < 15; i++) {
            const dust = document.createElement('div'); dust.className = 'dust-particle';
            const size = Math.random() * 3 + 1; dust.style.width = `${size}px`; dust.style.height = `${size}px`;
            dust.style.left = `${Math.random() * 100}%`; dust.style.animationDuration = `${Math.random() * 5 + 5}s`;
            dust.style.animationDelay = `${Math.random() * 5}s`; goldenDust.appendChild(dust);
        }

        function generateAI() {
            const btn = document.querySelector('.btn-generate');
            const originalText = btn.innerHTML;
            btn.innerHTML = "⏳ Generating...";
            btn.style.opacity = "0.8";
            setTimeout(() => {
                alert("تم استلام طلبك بنجاح! سيتم ربط المحرك (OmniRoute) قريباً.");
                btn.innerHTML = originalText; btn.style.opacity = "1";
            }, 1500);
        }
    </script>
</body>
</html>
