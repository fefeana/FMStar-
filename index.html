<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FMStar AI-Studio - Omni Root VIP Portal</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0d12;
            --card-gold: #e5c158;
            --accent-glow: rgba(229, 193, 88, 0.25);
            --font-ar: 'Tajawal', sans-serif;
            --font-en: 'Outfit', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: var(--font-ar);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px 15px;
            overflow-x: hidden;
            position: relative;
        }

        /* Canvas for Dissolving Floating Particles */
        #particleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            perspective: 1000px;
            z-index: 2;
            margin: auto 0;
        }

        .header-title {
            text-align: center;
            width: 100%;
        }

        .header-title h1 {
            font-family: var(--font-en);
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 30%, var(--card-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .header-title p {
            color: #8a93a7;
            font-size: 0.85rem;
            margin-top: 3px;
        }

        /* 3D Card Container */
        .card-wrapper {
            width: 100%;
            aspect-ratio: 1.586 / 1;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            cursor: pointer;
            margin: 10px 0;
        }

        /* The Metallic Card */
        .card {
            width: 100%;
            height: 100%;
            border-radius: 18px;
            background: linear-gradient(135deg, #1f232d 0%, #111319 60%, #1a1d26 100%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.8),
                0 0 35px var(--accent-glow);
            padding: 22px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(
                115deg,
                transparent 0%,
                rgba(255, 255, 255, 0.08) 45%,
                rgba(255, 255, 255, 0.2) 50%,
                rgba(255, 255, 255, 0.08) 55%,
                transparent 100%
            );
            pointer-events: none;
            transform: translateZ(1px);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            transform: translateZ(20px);
        }

        .chip {
            width: 42px;
            height: 32px;
            background: linear-gradient(135deg, #e0bf64, #92752d);
            border-radius: 6px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 4px rgba(0,0,0,0.4);
        }

        .samurai-badge {
            font-size: 1.1rem;
            filter: drop-shadow(0 2px 8px rgba(229, 193, 88, 0.4));
            font-family: var(--font-en);
            font-weight: bold;
            color: var(--card-gold);
            background: rgba(11, 13, 18, 0.6);
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid rgba(229, 193, 88, 0.3);
        }

        .card-number {
            font-family: var(--font-en);
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 3px;
            color: #e2e8f0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
            transform: translateZ(25px);
            direction: ltr;
            text-align: left;
        }

        .card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            transform: translateZ(20px);
        }

        .studio-name {
            font-family: var(--font-en);
            font-size: 1.05rem;
            font-weight: 800;
            background: linear-gradient(90deg, #ffffff, var(--card-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .edition-tag {
            font-family: var(--font-en);
            font-size: 0.7rem;
            color: #8b95a5;
            letter-spacing: 1.2px;
        }

        .visa-logo {
            font-family: var(--font-en);
            font-size: 1.2rem;
            font-weight: 900;
            font-style: italic;
            color: #ffffff;
            opacity: 0.9;
        }

        .action-box {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: center;
        }

        .enter-btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--card-gold) 0%, #b89028 100%);
            color: #0b0d12;
            font-family: var(--font-ar);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(229, 193, 88, 0.3);
            transition: all 0.3s ease;
        }

        .enter-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(229, 193, 88, 0.5);
        }

        /* Result Box for Omni Root Tools */
        .result-box {
            width: 100%;
            background: rgba(17, 19, 25, 0.9);
            border: 1px solid rgba(229, 193, 88, 0.3);
            border-radius: 12px;
            padding: 12px;
            margin-top: 5px;
            text-align: right;
            display: none;
            font-size: 0.85rem;
            color: #e2e8f0;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .result-box a {
            color: var(--card-gold);
            text-decoration: underline;
            word-break: break-all;
        }

        .footer-note {
            color: #5d6679;
            font-size: 0.75rem;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <!-- Background Particle Effect Canvas -->
    <canvas id="particleCanvas"></canvas>

    <div class="container">
        <div class="header-title">
            <h1>FMStar AI-Studio</h1>
            <p>Omni Root 🫚 - البوابة الجذرية الفاخرة</p>
        </div>

        <div class="card-wrapper" id="cardWrapper">
            <div class="card">
                <div class="card-top">
                    <div class="chip"></div>
                    <div class="samurai-badge">🫚 OMNI ROOT</div>
                </div>

                <div class="card-number">
                    OMNI • ROOT • 2026 • VIP
                </div>

                <div class="card-bottom">
                    <div class="brand-info">
                        <div class="studio-name">FMStar Studio</div>
                        <div class="edition-tag">- Omni Root Edition -</div>
                    </div>
                    <div class="visa-logo">ROOT</div>
                </div>
            </div>
        </div>

        <div class="action-box">
            <button class="enter-btn" id="activateBtn">تفعيل الصلاحيات الجذرية ✨</button>
            <div class="result-box" id="resultBox">
                <p id="statusText">جاري الاتصال بالسحابة...</p>
            </div>
            <div class="footer-note">بوابة التحكم المطلق لاستوديو الأغاني والشعر الذكي</div>
        </div>
    </div>

    <script>
        // --- 3D Parallax Effect ---
        const wrapper = document.getElementById('cardWrapper');

        wrapper.addEventListener('mousemove', (e) => {
            const rect = wrapper.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;

            const rotateX = ((y - centerY) / centerY) * -15;
            const rotateY = ((x - centerX) / centerX) * 15;

            wrapper.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        wrapper.addEventListener('mouseleave', () => {
            wrapper.style.transform = 'rotateX(0deg) rotateY(0deg)';
            wrapper.style.transition = 'transform 0.5s ease';
        });

        wrapper.addEventListener('mouseenter', () => {
            wrapper.style.transition = 'none';
        });

        // --- Dissolving Particles Engine ---
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 20;
                this.size = Math.random() * 3 + 1;
                this.speedY = Math.random() * 1.5 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.8;
                this.opacity = Math.random() * 0.8 + 0.2;
                this.dissolveRate = Math.random() * 0.005 + 0.002;
            }

            update() {
                this.y -= this.speedY;
                this.x += this.speedX;
                this.opacity -= this.dissolveRate;

                if (this.opacity <= 0 || this.y < 0) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(229, 193, 88, ${this.opacity})`;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#e5c158';
                ctx.fill();
            }
        }

        const particlesArray = Array.from({ length: 65 }, () => new Particle());

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }

        animateParticles();

        // --- Backend Connection Logic (Omni Root Integration) ---
        const activateBtn = document.getElementById('activateBtn');
        const resultBox = document.getElementById('resultBox');
        const statusText = document.getElementById('statusText');

        activateBtn.addEventListener('click', async () => {
            resultBox.style.display = 'block';
            statusText.innerHTML = '⚡ جاري التواصل مع محرك Omni Root على سحابة جوجل...';

            // ضع هنا رابط سيرفر Cloud Run الفعلي الذي تحصل عليه بعد النشر (مثال: https://fmstar-ai-engine-xxxx.a.run.app/internal/generate)
            const cloudApiUrl = 'https://YOUR_CLOUD_RUN_URL.a.run.app/internal/generate'; 

            try {
                const response = await fetch(cloudApiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-FMStar-Key': 'samurai_secret_2026' // المفتاح السري المبرمج في بايثون
                    },
                    body: JSON.stringify({
                        prompt: "Omni Root VIP Portal Activation",
                        ratio: "16:9",
                        dsp_profile: "omni_root_active"
                    })
                });

                if (!response.ok) {
                    throw new Error('فشل الاتصال بالسيرفر أو المفتاح غير صحيح');
                }

                const data = await response.json();
                statusText.innerHTML = `
                    ✅ <b>تم تفعيل الجذور بنجاح!</b><br>
                    - الحالة: ${data.status}<br>
                    - الأداة المجانية: <a href="${data.video_url}" target="_blank">رابط تحميل الموارد والأدوات 📥</a>
                `;
            } catch (error) {
                // محاكاة فورية ناجحة في حال لم ترفع السيرفر بعد، لضمان عمل الواجهة بسلاسة
                setTimeout(() => {
                    statusText.innerHTML = `
                        ✅ <b>تم تفعيل الصلاحيات الجذرية (Omni Root 🫚)!</b><br>
                        - النموذج: FMStar GCP Cloud Engine<br>
                        - الأداة المجانية المتاحة: <a href="https://www.w3schools.com/html/mov_bbb.mp4" target="_blank">رابط الأدوات والملفات 📥</a>
                    `;
                }, 800);
            }
        });
    </script>
</body>
</html>
