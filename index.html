<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FMStar AI - The Creative Realm</title>
    
    <!-- 🛡️ حماية ميتا -->
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">

    <!-- خط Inter الحديث -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #020205; /* أغمق من الأول عشان النجوم تبان */
            --glass-bg: rgba(15, 15, 20, 0.65); /* زجاج شفاف شوية عشان الحركة تبان من وراه */
            --primary-blue: #3b82f6;
            --neon-blue: #00d4ff; 
            --gold-primary: #D4AF37;
            --text-main: #f8fafc;
            --text-muted: #a1a1aa;
            --radius-lg: 16px;
            --radius-md: 10px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 130px; 
            position: relative;
            overflow-x: hidden;
        }

        /* 🌌 1. خلفية السماء والنجوم */
        .star-sky {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            background: radial-gradient(circle at 50% 0%, #0d1025 0%, #020205 70%);
        }

        .star {
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            opacity: 0;
            animation: twinkle infinite alternate;
        }

        /* ✨ 2. الغبار الذهبي المتحرك */
        .golden-dust {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .dust-particle {
            position: absolute;
            bottom: -10px;
            background: var(--gold-primary);
            border-radius: 50%;
            box-shadow: 0 0 10px 2px rgba(212, 175, 55, 0.6);
            animation: floatUp linear infinite;
        }

        /* 🎬 الأنيميشن بتاع النجوم */
        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 10px #fff; }
        }

        /* 🎬 الأنيميشن بتاع الغبار الذهبي */
        @keyframes floatUp {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-100vh) translateX(50px); opacity: 0; }
        }

        /* 🏷️ الهيدر */
        .header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            z-index: 10;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 800;
            font-size: 22px;
            letter-spacing: -0.5px;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        .logo-icon { font-size: 18px; color: var(--gold-primary); }

        .login-btn {
            background: rgba(0, 0, 0, 0.5);
            color: var(--text-main);
            border: 1px solid var(--neon-blue);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            backdrop-filter: blur(5px);
        }
        .login-btn:hover { background: rgba(0, 212, 255, 0.2); }

        /* 📦 المحتوى الرئيسي */
        .main-container {
            width: 100%;
            max-width: 600px;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 10;
        }

        /* 💎 الكارت الزجاجي */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(0, 212, 255, 0.05);
        }

        .hero-title {
            font-size: 28px;
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 10px;
            text-align: center;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 0%, #fcf6ba 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 0px 10px rgba(212,175,55,0.2));
        }
        
        .hero-title span {
            color: var(--gold-primary);
            -webkit-text-fill-color: var(--gold-primary);
        }

        .hero-desc {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.5;
        }

        /* 🛠️ نموذج الإدخال */
        .input-group { margin-bottom: 12px; }

        .input-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
            display: block;
        }

        .select-wrapper { position: relative; width: 100%; }
        .select-wrapper::after {
            content: '▼';
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 10px;
            pointer-events: none;
        }

        .custom-select, .custom-textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #27272a;
            border-radius: var(--radius-md);
            padding: 12px;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            outline: none;
            transition: 0.3s;
            scroll-margin-bottom: 150px; 
        }

        .custom-select {
            appearance: none;
            -webkit-appearance: none;
            padding-left: 35px;
            cursor: pointer;
        }

        .custom-select:focus, .custom-textarea:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
        }

        .custom-textarea { resize: none; height: 90px; }

        /* 📱 شبكة الأدوات */
        .tools-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 5px;
        }

        .tool-card {
            background: rgba(18, 18, 22, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid #27272a;
            border-radius: var(--radius-lg);
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 110px;
            cursor: pointer;
            transition: 0.2s;
        }

        .tool-card:hover {
            border-color: var(--gold-primary);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }

        .tool-icon { font-size: 20px; margin-bottom: 6px; }

        .tool-title {
            font-weight: 700;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
            color: #fff;
        }

        .badge {
            font-size: 8px;
            background: var(--gold-primary);
            color: #000;
            padding: 2px 5px;
            border-radius: 4px;
            font-weight: 800;
        }
        .badge.blue { background: var(--neon-blue); }

        .tool-desc { color: var(--text-muted); font-size: 10px; line-height: 1.3; }

        /* 🔵 الزر السفلي الثابت */
        .fixed-bottom {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(5, 5, 7, 0.85);
            backdrop-filter: blur(20px);
            padding: 12px 20px;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            display: flex;
            justify-content: center;
            z-index: 100;
        }

        .btn-generate {
            width: 100%;
            max-width: 560px;
            background: var(--primary-blue);
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 14px;
            border-radius: var(--radius-md);
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }

        .btn-generate:hover { background: #2563eb; }
    </style>
</head>
<body>

    <!-- 1. سماء الليل -->
    <div class="star-sky" id="starSky"></div>

    <!-- 2. الغبار الذهبي -->
    <div class="golden-dust" id="goldenDust"></div>

    <!-- الهيدر -->
    <header class="header">
        <div class="logo">
            <span class="logo-icon">✦</span> FMStar
        </div>
        <button class="login-btn">Log in</button>
    </header>

    <!-- المحتوى -->
    <main class="main-container">
        
        <div class="glass-card">
            <h1 class="hero-title">ENTER THE <span>CREATIVE</span><br>REALM</h1>
            <p class="hero-desc">Every top AI model in one studio. Turn your imagination into reality.</p>
            
            <div class="input-group">
                <label class="input-label">Select AI Creation Tool</label>
                <div class="select-wrapper">
                    <select class="custom-select">
                        <option>🎬 Video Generation (Seedance 2.5)</option>
                        <option>🎵 Music Generation (Kling 3.0)</option>
                        <option>🎙️ Vibe Voice (Microsoft MIT)</option>
                        <option>📜 Poetry Creation (Gemini)</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">Describe your imagination</label>
                <textarea class="custom-textarea" placeholder="Example: A cinematic video of a poet in the desert with epic music..."></textarea>
            </div>
        </div>

        <!-- شبكة الأدوات -->
        <div class="tools-grid">
            <div class="tool-card">
                <div>
                    <div class="tool-icon">🎬</div>
                    <div class="tool-title">Video Gen <span class="badge blue">TOP</span></div>
                </div>
                <div class="tool-desc">The most advanced video model</div>
            </div>
            <div class="tool-card">
                <div>
                    <div class="tool-icon">🎙️</div>
                    <div class="tool-title">Vibe Voice <span class="badge">NEW</span></div>
                </div>
                <div class="tool-desc">Microsoft's open-source voice</div>
            </div>
            <div class="tool-card">
                <div>
                    <div class="tool-icon">📜</div>
                    <div class="tool-title">Poetry Engine</div>
                </div>
                <div class="tool-desc">Generate poems in 17 dialects</div>
            </div>
            <div class="tool-card">
                <div>
                    <div class="tool-icon">🎵</div>
                    <div class="tool-title">Music Studio</div>
                </div>
                <div class="tool-desc">Create hit songs instantly</div>
            </div>
        </div>

    </main>

    <!-- الزر السفلي الثابت -->
    <div class="fixed-bottom">
        <button class="btn-generate" onclick="generateAI()">
            ✨ Generate Now
        </button>
    </div>

    <!-- سكريبت لتوليد النجوم والغبار الذهبي بشكل عشوائي -->
    <script>
        // 1. توليد النجوم
        const starSky = document.getElementById('starSky');
        for (let i = 0; i < 50; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 2 + 1; // حجم النجمة من 1 لـ 3 بيكسل
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.animationDuration = `${Math.random() * 2 + 1}s`; // سرعة اللمعان
            star.style.animationDelay = `${Math.random() * 2}s`;
            starSky.appendChild(star);
        }

        // 2. توليد الغبار الذهبي
        const goldenDust = document.getElementById('goldenDust');
        for (let i = 0; i < 20; i++) {
            const dust = document.createElement('div');
            dust.className = 'dust-particle';
            const size = Math.random() * 3 + 2; // حجم الحبيبة
            dust.style.width = `${size}px`;
            dust.style.height = `${size}px`;
            dust.style.left = `${Math.random() * 100}%`;
            dust.style.animationDuration = `${Math.random() * 5 + 5}s`; // من 5 لـ 10 ثواني عشان تطلع لفوق
            dust.style.animationDelay = `${Math.random() * 5}s`;
            goldenDust.appendChild(dust);
        }

        // 3. دالة الزر
        function generateAI() {
            const btn = document.querySelector('.btn-generate');
            const originalText = btn.innerHTML;
            btn.innerHTML = "⏳ Generating...";
            btn.style.opacity = "0.8";
            
            setTimeout(() => {
                alert("تم استلام طلبك بنجاح! سيتم ربط المحرك (OmniRoute) قريباً.");
                btn.innerHTML = originalText;
                btn.style.opacity = "1";
            }, 1500);
        }
    </script>
</body>
</html>
