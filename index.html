<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FMStar - Secure App</title>

    <!-- 0. سكريبت إعادة التوجيه الإجباري إلى HTTPS -->
    <script>
        if (window.location.protocol === 'http:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
            window.location.href = window.location.href.replace('http:', 'https:');
        }
    </script>

    <!-- 1 & 2. سياسة أمان المحتوى (CSP) مع ترقية الطلبات لـ HTTPS ومنع التجسس -->
    <meta http-equiv="Content-Security-Policy" 
          content="upgrade-insecure-requests; default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:;">

    <!-- 3. حماية الموقع من التضمين داخل إطارات وهمية (Anti-Clickjacking) -->
    <meta http-equiv="X-Frame-Options" content="DENY">

    <!-- 4. حماية البيانات المرجعية لمنع تسريب الروابط والمعلومات (Referrer Policy) -->
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <!-- 5. منع المتصفح من تخمين نوع الملفات لحماية الموقع من الثغرات (X-Content-Type-Options) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">

    <!-- 6. تعطيل وصول الموقع للكاميرا والميكروفون والموقع الجغرافي لحماية الخصوصية -->
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">

    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .status-badge {
            display: inline-block;
            background-color: #238636;
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        h1 {
            color: #58a6ff;
            margin-bottom: 10px;
            font-size: 24px;
        }
        p {
            line-height: 1.6;
            font-size: 15px;
            color: #8b949e;
        }
    </style>
</head>
<body>

    <div class="card">
        <span class="status-badge">🔒 اتصال مشفّر ومؤمن</span>
        <h1>مرحباً بك في FMStar</h1>
        <p>تم تفعيل طبقات الحماية وتثبيت سياسات الأمان لمنع التجسس واعتراض البيانات.</p>
    </div>

    <script>
        // كود حماية إضافي لمنع فتح الصفحة داخل Iframe
        if (window.top !== window.self) {
            window.top.location = window.self.location;
        }
    </script>
</body>
</html>
