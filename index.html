<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FMStar AI Studio - VIP</title>
    
    <!-- 🛡️ حماية ميتا -->
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">

    <!-- خطوط جوجل الفخمة -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Inter:wght@400;500;600&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #050507;
            --gold-primary: #D4AF37;
            --gold-light: #F3E5AB;
            --gold-dark: #997A00;
            --text-muted: #8A8F98;
            --glass-bg: rgba(20, 20, 25, 0.4);
            --glass-border: rgba(212, 175, 55, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: white;
            font-family: 'Tajawal', 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        /* ✨ تأثير الإضاءة والخلفية (محاكاة دبي) */
        .ambient-light {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: 
                radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(0, 150, 255, 0.1) 0%, transparent 50%);
            z-index: -1;
        }

        /* 🏷️ الترويسة العلوية */
        .header {
            width: 100%;
            max-width: 480px;
            text-align: center;
            margin-bottom: 20px;
            margin-top: 10px;
            z-index: 10;
        }

        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 38px;
            font-weight: 800;
            background: linear-gradient(to right, var(--gold-light), var(--gold-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .logo-subtitle {
            font-size: 10px;
            letter-spacing: 3px;
            color: var(--gold-primary);
            text-transform: uppercase;
        }

        /* 💎 اللوحة الزجاجية الشفافة (Glassmorphism) */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px 20px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.05);
            position: relative;
            z-index: 10;
        }

        /* ✨ لمعة زجاجية علوية */
        .glass-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
        }

        .hero-title {
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            line-height: 1.4;
            margin-bottom: 25px;
            color: #fff;
        }
        .hero-title span { color: var(--gold-primary); display: block; }

        /* 🛠️ القائمة المنسدلة */
        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-label {
            font-size: 11px;
            color: var(--gold-primary);
            margin-bottom: 8px;
            display: block;
            font-family: 'Inter', sans-serif;
            letter-spacing: 1px;
        }

        .custom-select {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            padding: 15px;
            color: white;
            font-family: 'Tajawal', sans-serif;
            font-size: 14px;
            outline: none;
            appearance: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .custom-select:focus, .custom-select:hover {
            border-color: var(--gold-primary);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }

        /* سهم القائمة المنسدلة */
        .input-group::after {
            content: '▼';
            position: absolute;
            left: 15px;
            top: 42px;
            color: var(--gold-primary);
            font-size: 10px;
            pointer-events: none;
        }

        /* 📝 مساحة الكتابة */
        .text-area {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            color: white;
            font-family: 'Tajawal', sans-serif;
            font-size: 14px;
            resize: none;
            outline: none;
            height: 120px;
            transition: 0.3s;
        }

        .text-area::placeholder { color: rgba(255,255,255,0.3); }

        .text-area:focus {
            border-color: var(--gold-primary);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.1);
        }

        /* 🚀 زر التوليد */
        .btn-generate {
            width: 100%;
            background: linear-gradient(90deg, var(--gold-dark), var(--gold-primary), var(--gold-light), var(--gold-primary), var(--gold-dark));
            background-size: 200% auto;
            color: #000;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 25px;
            transition: 0.5s;
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.2);
        }

        .btn-generate:hover {
            background-position: right center;
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(212, 175, 55, 0.4);
        }

        .btn-generate:active { transform: translateY(0); }

        /* ⚡ الفوتر */
        .footer {
            margin-top: 20px;
            display: flex;
            gap: 20px;
            color: var(--text-muted);
            font-size: 11px;
            z-index: 10;
        }
        .footer-item { display: flex; align-items: center; gap: 5px; }
        .footer-item span { color: var(--gold-primary); }
    </style>
</head>
<body>

    <div class="ambient-light"></div>

    <!-- الترويسة -->
    <header class="header">
        <div class="logo-text">FMStar</div>
        <div class="logo-subtitle">AI STUDIO · VIP EXPERIENCE</div>
    </header>

    <!-- اللوحة الزجاجية -->
    <main class="glass-panel">
        <h1 class="hero-title">
            IF YOU CAN IMAGINE IT <span>AI CAN CREATE IT</span>
        </h1>

        <!-- اختيار الأداة -->
        <div class="input-group">
            <label class="input-label">Select AI Creation Tool</label>
            <select class="custom-select">
                <option>🎬 Video Generation (توليد فيديو)</option>
                <option>🎵 Music Generation (توليد موسيقى)</option>
                <option>🎙️ Vibe Voice (توليد صوت)</option>
                <option>📜 Poetry Creation (إنشاء شعر)</option>
                <option>🎨 Image Generator (توليد صور)</option>
            </select>
        </div>

        <!-- مساحة الوصف -->
        <div class="input-group">
            <label class="input-label">Describe your imagination</label>
            <textarea class="text-area" placeholder="اكتب فكرتك هنا... مثال: مشهد سينمائي لشاعر يلقي قصيدة في الصحراء مع موسيقى ملحمية..."></textarea>
        </div>

        <!-- زر التوليد -->
        <button class="btn-generate" onclick="generateAI()">
            <span>✨</span> Generate Now <span>→</span>
        </button>
    </main>

    <!-- الفوتر -->
    <footer class="footer">
        <div class="footer-item"><span>🛡️</span> Encrypted Access</div>
        <div class="footer-item"><span>∞</span> AI Powered</div>
    </footer>

    <!-- ربط الأزرار (سيتم تعديله لاحقاً لربطه بـ OmniRoute) -->
    <script>
        function generateAI() {
            const btn = document.querySelector('.btn-generate');
            const originalText = btn.innerHTML;
            btn.innerHTML = "⏳ Processing...";
            btn.style.color = "#fff";
            
            setTimeout(() => {
                alert("تم استلام طلبك بنجاح! سيتم ربط المحرك السحابي قريباً.");
                btn.innerHTML = originalText;
                btn.style.color = "#000";
            }, 1500);
        }
    </script>
</body>
</html>
