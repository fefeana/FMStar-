<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star FM | AI Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #a855f7; border-radius: 10px; }
    </style>
</head>
<body class="bg-[#0a0514] text-white overflow-x-hidden min-h-screen relative selection:bg-purple-500 selection:text-white">

    <div class="fixed top-0 left-0 w-full h-full bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-purple-900/30 via-[#0a0514] to-[#0a0514] pointer-events-none z-0"></div>

    <div class="relative z-10 flex flex-col items-center w-full max-w-4xl mx-auto p-4 md:p-8">
        
        <div class="text-center mb-8 mt-4">
            <h1 class="text-4xl md:text-5xl font-bold tracking-wider mb-2 text-white">Star FM <span class="text-purple-400">AI STUDIO</span></h1>
            <p class="text-purple-300 text-sm tracking-widest font-semibold mt-2">حيث يلتقي الإبداع بذكاء أعلى</p>
        </div>

        <div class="w-full bg-[#1a1025]/80 backdrop-blur-xl border border-purple-500/30 rounded-3xl p-4 mb-6 relative overflow-hidden shadow-[0_0_40px_rgba(168,85,247,0.15)]">
            <div class="absolute top-4 left-4 text-xs text-gray-400 bg-black/50 px-2 py-1 rounded z-20">1 / 3</div>
            
            <div id="resultContainer" class="w-full h-72 md:h-96 bg-gray-900 rounded-2xl overflow-hidden relative flex items-center justify-center">
                <img src="https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?q=80&w=2070&auto=format&fit=crop" alt="Studio" class="absolute inset-0 w-full h-full object-cover opacity-40" id="placeholderImage">
                
                <div class="relative z-10 w-16 h-16 bg-pink-500 rounded-full flex items-center justify-center shadow-[0_0_20px_rgba(236,72,153,0.6)] cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" class="text-white ml-1"><path d="M8 5v14l11-7z"/></svg>
                </div>
            </div>
            <h3 class="text-center text-2xl font-bold text-white mt-4 mb-1">بيئة من صنعك</h3>
            <p class="text-center text-sm text-purple-300">الآن بث مباشر عبر الأثير</p>
        </div>

        <div class="w-full bg-[#1a1025]/80 backdrop-blur-xl border border-purple-500/30 rounded-3xl p-6 shadow-2xl relative">
            
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-2 bg-purple-900/30 border border-purple-500/30 p-2 px-4 rounded-xl text-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-purple-400"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
                    <span>توليد الأغنية • الشعر • الفيديو</span>
                </div>
                <span class="text-xs text-purple-300" id="charCount">0 / 280</span>
            </div>

            <textarea 
                id="promptInput"
                class="w-full h-32 bg-transparent border-none outline-none resize-none placeholder-gray-500 text-lg text-white focus:ring-0"
                placeholder="اكتب فكرتك هنا... أغنية، قصيدة، أو فيديو"
                maxlength="280"
            ></textarea>

            <div class="mt-4 border-t border-purple-500/20 pt-4">
                <div class="flex items-center gap-2 mb-3">
                   <span class="text-sm font-medium">التأثيرات</span>
                   <span class="text-xs bg-purple-600/30 text-purple-300 px-2 py-0.5 rounded-full">2 مختار</span>
                </div>
                <div class="flex flex-wrap gap-2">
                   <button class="px-4 py-2 rounded-xl text-sm border bg-purple-600/40 border-purple-400 text-white shadow-[0_0_10px_rgba(168,85,247,0.3)]">سينمائي</button>
                   <button class="px-4 py-2 rounded-xl text-sm border bg-purple-600/40 border-purple-400 text-white shadow-[0_0_10px_rgba(168,85,247,0.3)]">حزين</button>
                   <button class="px-4 py-2 rounded-xl text-sm border bg-transparent border-gray-600 text-gray-400 hover:border-purple-500">رومانسي</button>
                   <button class="px-4 py-2 rounded-xl text-sm border bg-transparent border-gray-600 text-gray-400 hover:border-purple-500">حماسي</button>
                </div>
            </div>

            <button 
                id="generateBtn"
                class="mt-6 w-full bg-gradient-to-r from-purple-600 to-pink-500 hover:from-purple-500 hover:to-pink-400 text-white font-bold py-4 rounded-xl shadow-[0_0_20px_rgba(168,85,247,0.4)] transition-all flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed"
            >
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="animate-pulse"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
                <span id="btnText">✨ توليد بالذكاء الاصطناعي</span>
            </button>

        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const generateBtn = document.getElementById('generateBtn');
            const promptInput = document.getElementById('promptInput');
            const btnText = document.getElementById('btnText');
            const resultContainer = document.getElementById('resultContainer');
            const charCount = document.getElementById('charCount');

            promptInput.addEventListener('input', () => {
                charCount.textContent = `${promptInput.value.length} / 280`;
            });

            // ⚠️ الرابط الثابت الجديد بتاع Render
            const API_BASE_URL = "https://fmstar-backend-v2.onrender.com";
            const API_KEY = "samurai_secret_2026";

            // 🚀 كود الصحوة (Wake-up Ping) عشان نصحّي سيرفر Render
            fetch(API_BASE_URL + '/')
                .then(res => console.log("السيرفر صحي! ☀️"))
                .catch(err => console.log("جاري إيقاظ السيرفر من النوم... ⏳"));

            generateBtn.addEventListener('click', async (e) => {
                e.preventDefault();
                
                const text = promptInput.value.trim();
                if (!text) {
                    alert("اكتب فكرتك هنا أولاً...");
                    return;
                }

                btnText.innerHTML = "⏳ جاري التوليد...";
                generateBtn.disabled = true;

                try {
                    // تأكدي من المسار الجديد بتاع الباك إند
                    const res = await fetch(`${API_BASE_URL}/v1/audio/generations`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-FMStar-Key': API_KEY
                        },
                        body: JSON.stringify({
                            prompt: text,
                            ratio: "16:9",
                            dsp_profile: "cinematic"
                        })
                    });

                    const data = await res.json();

                    if (res.ok) {
                        // عرض الكلام اللي الـ AI كتبه (optimized_prompt)
                        resultContainer.innerHTML = `
                            <div class="absolute inset-0 bg-[#0a0514]/90 p-6 flex flex-col items-center justify-start text-center overflow-y-auto w-full h-full rounded-2xl">
                                <h3 class="text-purple-400 text-sm mb-4 font-bold border-b border-purple-500/30 pb-2 w-full">المحرك: ${data.model_used || 'OmniRoute AI'}</h3>
                                <p class="text-white text-lg whitespace-pre-wrap leading-relaxed">${data.optimized_prompt || 'جاري التوليد...'}</p>
                            </div>
                        `;
                        
                        // تشغيل الفيديو لو رجع (حالياً بيرجع فيديو الأرنب عشان الاختبار)
                        if (data.video_url) {
                             // ممكن تشيلي التعليق عن السطرين دول عشان تعرضي الفيديو بدل الكلام
                             // resultContainer.innerHTML = `<video controls autoplay src="${data.video_url}" class="w-full h-full object-cover rounded-2xl"></video>`;
                        }

                    } else {
                        alert("خطأ من السيرفر: " + (data.detail || "مشكلة غير معروفة"));
                    }
                } catch (error) {
                    console.error(error);
                    alert("فشل الاتصال بالسيرفر! لو أول مرة تفتحي، السيرفر ممكن يكون بينام وبياخد 50 ثانية يصحى. جربي تاني بعد شوية.");
                } finally {
                    btnText.innerHTML = "✨ توليد بالذكاء الاصطناعي";
                    generateBtn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
