<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star FM | AI Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #030712;
            color: #f3f4f6;
            overflow-x: hidden;
        }
        .glass-panel {
            background: rgba(17, 24, 39, 0.5);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
        }
        .gold-glow {
            text-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
        }
        .neon-border {
            border: 1px solid rgba(236, 72, 153, 0.35);
            box-shadow: 0 0 30px rgba(236, 72, 153, 0.15);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 relative" x-data="{ prompt: '', charCount: 0, isGenerating: false }">

    <!-- إضاءات خلفية سينمائية ناعمة ومتناسقة -->
    <div class="absolute inset-0 z-0 overflow-hidden opacity-25 pointer-events-none">
        <div class="absolute -top-32 -left-32 w-80 h-80 bg-purple-600 rounded-full filter blur-[100px]"></div>
        <div class="absolute top-1/3 -right-32 w-80 h-80 bg-blue-600 rounded-full filter blur-[100px]"></div>
    </div>

    <!-- الهيدر العلوي الأنيق -->
    <header class="w-full max-w-md flex justify-between items-center mb-5 z-10 px-2">
        <div class="flex items-center gap-2 bg-white/5 px-3 py-1 rounded-full border border-white/10 backdrop-blur-md">
            <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
            <span class="text-[10px] tracking-wider text-cyan-300 font-semibold uppercase">AI STUDIO</span>
        </div>
        <h1 class="text-lg font-black tracking-widest text-white gold-glow">Star <span class="text-pink-500">FM</span></h1>
    </header>

    <!-- نافذة العرض السينمائية المدمجة (صورة الاستوديو مع مشغل الصوت الزجاجي) -->
    <div class="w-full max-w-md glass-panel rounded-3xl p-3 mb-4 z-10 neon-border relative overflow-hidden">
        <div class="relative h-56 rounded-2xl overflow-hidden shadow-inner">
            <!-- خلفية الاستوديو السينمائية الأصلية -->
            <div class="absolute inset-0 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?q=80&w=1000&auto=format&fit=crop');"></div>
            <!-- تدرج ليلى سينمائي يبرز جمال الصورة -->
            <div class="absolute inset-0 bg-gradient-to-t from-gray-950 via-gray-950/40 to-transparent"></div>
            
            <!-- محتوى البث فوق الصورة -->
            <div class="absolute bottom-4 left-4 right-4 flex items-center justify-between">
                <div>
                    <span class="text-[10px] bg-pink-600/90 backdrop-blur-md text-white px-2.5 py-0.5 rounded-full uppercase tracking-wider shadow">الآن يبث عبر الأثير</span>
                    <h2 class="text-xl font-bold text-white mt-1.5 gold-glow">ليلة من صنعك</h2>
                </div>
                <button class="w-12 h-12 rounded-full bg-gradient-to-r from-pink-500 to-purple-600 flex items-center justify-center text-white shadow-lg shadow-pink-600/40 transform hover:scale-105 transition-all">
                    <svg class="w-5 h-5 fill-current translate-x-0.5" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
            </div>
        </div>
        <!-- مؤشر بسيط ودقيق -->
        <div class="flex justify-center items-center gap-2 mt-2.5">
            <span class="text-[11px] text-gray-400">1 / 3</span>
            <div class="w-10 h-1 bg-gradient-to-r from-pink-500 to-purple-500 rounded-full"></div>
        </div>
    </div>

    <!-- صندوق الإدخال الموحد والذكي (Omni-Glassmorphism) -->
    <div class="w-full max-w-md glass-panel rounded-3xl p-5 z-10 shadow-2xl">
        
        <div class="relative mb-3">
            <textarea 
                x-model="prompt" 
                @input="charCount = prompt.length"
                maxlength="2000"
                rows="3" 
                class="w-full bg-gray-950/60 border border-white/10 rounded-2xl p-4 text-sm text-white placeholder-gray-400 focus:outline-none focus:border-pink-500 transition-all resize-none shadow-inner"
                placeholder="اكتب فكرتك بحرية تامة: فيديو سينمائي، أغنية، أو قصيدة..."></textarea>
            
            <div class="absolute bottom-3 left-3 flex items-center gap-3 text-[11px] text-gray-400">
                <span x-text="2000 - charCount"></span> / 2000
                <label class="cursor-pointer hover:text-pink-400 transition-colors flex items-center gap-1 bg-white/5 px-2.5 py-1 rounded-lg border border-white/5">
                    <span>إرفاق ملف</span>
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path></svg>
                    <input type="file" class="hidden">
                </label>
            </div>
        </div>

        <!-- زر التوليد الذكي البارز -->
        <button class="w-full py-3.5 bg-gradient-to-r from-amber-500 via-pink-600 to-purple-600 hover:opacity-95 text-white font-bold text-sm rounded-2xl shadow-lg shadow-pink-600/30 flex items-center justify-center gap-2 transform active:scale-95 transition-all">
            <span>✨ توليد بالذكاء الاصطناعي</span>
        </button>

    </div>

    <!-- تذييل فاخر دقيق -->
    <footer class="mt-6 text-center text-[10px] text-gray-500 z-10 tracking-widest pb-4">
        DUBAI • NEW YORK • TOKYO • FOR A BRIGHTER TOMORROW
    </footer>

</body>
        </html>
