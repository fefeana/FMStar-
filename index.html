<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FMStar | AI Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #030712;
            color: #ffffff;
            overflow-x: hidden;
        }
        /* خلفية الاستوديو السينمائية الكاملة */
        .studio-bg {
            background-image: url('https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?q=80&w=1200&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }
        /* اللوح الزجاجي الشفاف النقي */
        .omni-glass {
            background: rgba(15, 23, 42, 0.35);
            backdrop-filter: blur(22px) saturate(160%);
            -webkit-backdrop-filter: blur(22px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65);
        }
        .gold-neon {
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.35);
        }
    </style>
</head>
<body class="min-h-screen studio-bg relative flex flex-col justify-between p-5" x-data="fmStarEngine()">

    <!-- طبقة تظليل سينمائية خفيفة لإبراز وضوح النصوص والزجاج -->
    <div class="fixed inset-0 bg-gradient-to-b from-black/60 via-black/30 to-black/80 pointer-events-none z-0"></div>

    <!-- الهيدر البسيط جداً -->
    <header class="relative z-10 flex justify-between items-center pt-2">
        <div class="flex items-center gap-2 bg-white/10 backdrop-blur-md px-3 py-1 rounded-full border border-white/10">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span class="text-[11px] font-semibold tracking-wider text-gray-200">AI STUDIO</span>
        </div>
        <h1 class="text-xl font-black tracking-wider text-white">
            FMStar <span class="text-amber-400">✨</span>
        </h1>
    </header>

    <!-- منتصف الشاشة: عنوان البث السينمائي العائم -->
    <div class="relative z-10 my-auto py-8 text-center">
        <span class="inline-block text-[11px] bg-pink-600/80 backdrop-blur-md text-white px-3 py-1 rounded-full mb-3 tracking-wide shadow-lg">
            الآن يُبث عبر الأثير
        </span>
        <h2 class="text-3xl font-black text-white drop-shadow-lg mb-2">ليلة من صنعك</h2>
        <p class="text-xs text-gray-300 max-w-xs mx-auto leading-relaxed">
            اكتب فكرتك بحرية تامة؛ فيديو سينمائي، أغنية، أو قصيدة... والباقي على الذكاء الفائق
        </p>
    </div>

    <!-- الواجهة الزجاجية الشفافة أمام الخلفية: صندوق واحد وزر واحد -->
    <main class="relative z-10 w-full max-w-md mx-auto omni-glass rounded-3xl p-5 mb-4">
        
        <!-- حقل الإدخال الموحد (بدون تبويبات معقدة) -->
        <div class="relative mb-4">
            <textarea 
                x-model="prompt"
                rows="3"
                maxlength="2000"
                class="w-full bg-black/30 border border-white/15 rounded-2xl p-4 text-sm text-white placeholder-gray-300/70 focus:outline-none focus:border-amber-400/70 transition-all resize-none"
                placeholder="صف خيالك الإبداعي هنا (أغنية، قصيدة، أو مشهد فيديو)..."></textarea>
            
            <!-- شريط المرفقات والعداد البسيط -->
            <div class="flex justify-between items-center mt-2 px-1 text-[11px] text-gray-300">
                <label class="cursor-pointer hover:text-amber-400 transition-colors flex items-center gap-1.5 bg-white/10 px-3 py-1 rounded-xl">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path></svg>
                    <span x-text="fileName ? fileName : 'إرفاق ملف'"></span>
                    <input type="file" class="hidden" @change="handleFile($event)">
                </label>
                <span x-text="prompt.length + ' / 2000'"></span>
            </div>
        </div>

        <!-- الزر الذهبي الواحد للتوليد -->
        <button 
            @click="triggerSilentPipeline()"
            :disabled="isGenerating || !prompt.trim()"
            class="w-full py-3.5 bg-gradient-to-r from-amber-500 via-orange-500 to-pink-600 hover:opacity-95 disabled:opacity-50 text-white font-bold text-sm rounded-2xl gold-neon flex items-center justify-center gap-2 transition-all active:scale-95">
            <span x-show="!isGenerating">✨ توليد بالذكاء الاصطناعي</span>
            <span x-show="isGenerating" class="flex items-center gap-2">
                <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                جاري المعالجة في الخلفية...
            </span>
        </button>

        <!-- نافذة عرض النتيجة (تظهر فقط عند جاهزية المخرج) -->
        <div x-show="outputReady" x-transition class="mt-4 p-4 bg-black/50 border border-amber-400/30 rounded-2xl text-xs text-gray-100 leading-relaxed">
            <div class="flex justify-between items-center mb-2 text-amber-400 font-bold">
                <span>النتيجة الإبداعية جاهزة ✨</span>
                <button @click="outputReady = false" class="text-gray-400 hover:text-white">✕</button>
            </div>
            <p x-text="outputResult"></p>
        </div>
    </main>

    <!-- محرك الخلفية الصامت (يعالج كل المهام والتوجيهات دون إزعاج الواجهة) -->
    <script>
        function fmStarEngine() {
            return {
                prompt: '',
                fileName: '',
                isGenerating: false,
                outputReady: false,
                outputResult: '',
                // إعدادات الخلفية المخفية (Security, MCP, Omni-Root, Auto-Detect)
                backgroundConfig: {
                    engine: 'Omni-Root-Silent',
                    sanitizer: true,
                    endpoint: '/api/v1/generate'
                },
                handleFile(e) {
                    if (e.target.files.length > 0) {
                        this.fileName = e.target.files[0].name;
                    }
                },
                // كشف نوع الوسائط تلقائياً في الخلفية دون إجبار المستخدم على الاختيار
                detectIntentInBackground(text) {
                    if (text.includes('فيديو') || text.includes('مشهد')) return 'video';
                    if (text.includes('قصيدة') || text.includes('شعر')) return 'poetry';
                    return 'song';
                },
                async triggerSilentPipeline() {
                    if (!this.prompt.trim()) return;
                    this.isGenerating = true;
                    this.outputReady = false;

                    // تنظيف المدخلات وتحديد نوع الوسائط بصمت تام في الخلفية
                    const cleanPrompt = this.prompt.replace(/<[^>]*>?/gm, '');
                    const detectedType = this.detectIntentInBackground(cleanPrompt);

                    // محاكاة الاتصال بالسيرفر الخلفي (127.0.0.1:8080)
                    setTimeout(() => {
                        this.isGenerating = false;
                        this.outputReady = true;
                        this.outputResult = `تمت المعالجة بنجاح في الخلفية (النوع المكتشف تلقائياً: ${detectedType}) للنص: "${cleanPrompt}"`;
                    }, 1200);
                }
            }
        }
    </script>
</body>
</html>
