<script>
(function() {
  const saved = (window.localStorage && localStorage.getItem("FMSTAR_API_BASE_URL")) || "";
  const isLocalOrSameHost = ["localhost", "127.0.0.1"].includes(window.location.hostname);
  window.FMSTAR_API_BASE_URL = window.FMSTAR_API_BASE_URL || saved || (isLocalOrSameHost ? "" : "https://fmstar-ai-studio.onrender.com");
  window.fmstarApiUrl = function(endpointPath) {
    const cleanPath = endpointPath.startsWith("/") ? endpointPath : "/" + endpointPath;
    return (window.FMSTAR_API_BASE_URL || "").replace(/\/+$/, "") + cleanPath;
  };
})();
</script>

    <script>
        // Secure Backend Endpoint Configuration
        const SECURE_GENERATE_API = window.fmstarApiUrl("/api/generate");
        let selectedTool = "أغنية";

        // Playlist State
        const playlist = [
            { id: "01", title: "ليلة من صنعك", meta: "Cyberpunk Ambient Radio • 120 BPM" },
            { id: "02", title: "أثير النيون الفضائي", meta: "Synth-Pop Synthwave • 128 BPM" },
            { id: "03", title: "أوتار السكون الأكوستيك", meta: "Acoustic Night Oud • 95 BPM" }
        ];
        let currentTrackIdx = 0;
        let isMusicPlaying = false;
        let audioContext = null;
        let synthInterval = null;

        const toggleBtn = document.getElementById('toggleEffects');
        const effectsPanel = document.getElementById('effectsPanel');
        const arrowIcon = document.getElementById('arrowIcon');
        const promptInput = document.getElementById('promptInput');
        const charCount = document.getElementById('charCount');
        const audioBarsContainer = document.getElementById('audioBarsContainer');
        const currentTrackTitle = document.getElementById('currentTrackTitle');
        const trackNumberText = document.getElementById('trackNumberText');
        const trackPaginationText = document.getElementById('trackPaginationText');
        const bottomPagination = document.getElementById('bottomPagination');
        const playIconSvg = document.getElementById('playIconSvg');
        const effectsSelectedCount = document.getElementById('effectsSelectedCount');

        // Accordion Toggle
        toggleBtn.addEventListener('click', () => {
            effectsPanel.classList.toggle('open');
            arrowIcon.classList.toggle('rotate-180');
        });

        // Input Counter
        promptInput.addEventListener('input', () => {
            charCount.innerText = `${promptInput.value.length} / 280`;
        });

        // Tool Selector
        document.querySelectorAll('.tool-chip').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tool-chip').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedTool = btn.getAttribute('data-tool') || 'أغنية';
            });
        });

        // Chips Selection (Effects / Dialect)
        document.querySelectorAll('#effectsPanel .chip').forEach(chip => {
            chip.addEventListener('click', () => {
                chip.classList.toggle('active');
                const count = document.querySelectorAll('#effectsPanel .chip.active').length;
                effectsSelectedCount.innerText = `مختار ${count}`;
            });
        });

        // --- Web Audio Synthesizer (Realistic Night Melodic Waves) ---
        function playChime(freq, duration = 0.4) {
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioContext.currentTime);
                gain.gain.setValueAtTime(0.12, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.start();
                osc.stop(audioContext.currentTime + duration);
            } catch (e) {}
        }

        function togglePlayMusic() {
            isMusicPlaying = !isMusicPlaying;
            if (isMusicPlaying) {
                audioBarsContainer.classList.remove('audio-bars-paused');
                playIconSvg.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
                
                // Play melodic ambient chord pattern
                const melodyNotes = [329.63, 392.00, 493.88, 587.33, 659.25]; // E minor scale
                let noteIdx = 0;
                synthInterval = setInterval(() => {
                    if (isMusicPlaying) {
                        playChime(melodyNotes[noteIdx % melodyNotes.length], 0.6);
                        noteIdx++;
                    }
                }, 600);
            } else {
                audioBarsContainer.classList.add('audio-bars-paused');
                playIconSvg.innerHTML = '<path d="M8 5v14l11-7z"/>';
                clearInterval(synthInterval);
            }
        }

        function updateTrackUI() {
            const track = playlist[currentTrackIdx];
            currentTrackTitle.innerText = track.title;
            trackNumberText.innerText = track.id;
            const paginationStr = `${currentTrackIdx + 1} / ${playlist.length}`;
            trackPaginationText.innerText = paginationStr;
            bottomPagination.innerText = paginationStr;
            if (isMusicPlaying) {
                playChime(440, 0.3);
            }
        }

        function nextTrack() {
            currentTrackIdx = (currentTrackIdx + 1) % playlist.length;
            updateTrackUI();
        }

        function prevTrack() {
            currentTrackIdx = (currentTrackIdx - 1 + playlist.length) % playlist.length;
            updateTrackUI();
        }

        // Initialize state
        audioBarsContainer.classList.add('audio-bars-paused');

        // --- Secure Backend API Generation ---
        async function generateContent() {
            const promptText = promptInput.value.trim();
            if (!promptText) {
                alert('يرجى كتابة وصف لفكرتك أو مطلع القصيدة أولاً.');
                return;
            }

            const selectedDialect = Array.from(document.querySelectorAll('#effectsPanel .chip.active'))
                .map(c => c.innerText)
                .join('، ') || 'سينمائي، ليلي';

            const btn = document.getElementById('generateBtn');
            const btnText = document.getElementById('btnText');
            const resultBox = document.getElementById('resultBox');

            btn.disabled = true;
            btnText.innerHTML = 'جاري التوليد الآمن <div class="spinner"></div>';
            resultBox.classList.add('hidden');
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }

            try {
                const response = await fetch(SECURE_GENERATE_API, {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        tool: selectedTool,
                        dialect: selectedDialect,
                        prompt: promptText
                    })
                });

                if (!response.ok) {
                    let serverErr = 'حدث خطأ في الخادم أو تجاوزت الحد المسموح للطلبات.';
                    try {
                        const errPayload = await response.json();
                        if (errPayload && errPayload.error) {
                            serverErr = response.status === 429
                                ? 'تجاوزت الحد المسموح للطلبات (10 طلبات في الدقيقة). يرجى الانتظار قليلاً.'
                                : errPayload.error;
                        }
                    } catch (_) {}
                    throw new Error(serverErr);
                }

                const data = await response.json();
                const generatedResult = data.result || data.lyrics || '';

                resultBox.classList.remove('hidden');
                resultBox.innerText = generatedResult;

                // Recite with speech synthesis
                if ('speechSynthesis' in window && generatedResult) {
                    const cleanSpeechText = generatedResult.replace(/[━•✨📻🎙️🎛️🛡️\[\]]/g, '');
                    const utterance = new SpeechSynthesisUtterance(cleanSpeechText);
                    utterance.lang = 'ar-SA';
                    utterance.rate = 0.95;
                    window.speechSynthesis.speak(utterance);
                }

                // Trigger music preview
                if (!isMusicPlaying) {
                    togglePlayMusic();
                }
            } catch (error) {
                resultBox.classList.remove('hidden');
                resultBox.innerText = `⚠️ عذراً يا FMStar ✨، حصل خطأ أثناء الاتصال بالخادم الآمن: ${error.message}`;
            } finally {
                btn.disabled = false;
                btnText.innerText = 'توليد بالذكاء الاصطناعي ✨';
            }
        }

        // Alias for backward compatibility
        const generateAI = generateContent;
    </script>
<script>
(function() {
  if (window.fmstarStudioEngine) return;

  const CACHE_PREFIX = "fmstar_studio_cache_v1:";

  function getCache(key) {
    try {
      const raw = localStorage.getItem(CACHE_PREFIX + key);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (Date.now() - parsed.ts > 1000 * 60 * 30) {
        localStorage.removeItem(CACHE_PREFIX + key);
        return null;
      }
      return parsed.value;
    } catch (_) {
      return null;
    }
  }

  function setCache(key, value) {
    try {
      localStorage.setItem(CACHE_PREFIX + key, JSON.stringify({ ts: Date.now(), value }));
    } catch (_) {}
  }

  function recordTelemetry(eventType, detail) {
    try {
      const logKey = "fmstar_studio_telemetry";
      const current = JSON.parse(localStorage.getItem(logKey) || "[]");
      current.push({ at: new Date().toISOString(), eventType, detail });
      localStorage.setItem(logKey, JSON.stringify(current.slice(-40)));
    } catch (_) {}
  }

  async function fetchWithSelfHeal(url, payload, retries = 1, timeoutMs = 20000) {
    let lastErr = null;
    for (let attempt = 0; attempt <= retries; attempt++) {
      const controller = typeof AbortController !== "undefined" ? new AbortController() : null;
      const timer = controller ? setTimeout(() => controller.abort(), timeoutMs) : null;
      try {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
          signal: controller ? controller.signal : undefined
        });
        if (res.ok) {
          return await res.json();
        }
        lastErr = new Error("HTTP " + res.status);
        recordTelemetry("retry_http", { url, attempt, status: res.status });
      } catch (err) {
        lastErr = err;
        recordTelemetry("retry_network", { url, attempt, error: String(err) });
      } finally {
        if (timer) clearTimeout(timer);
      }
    }
    throw lastErr || new Error("Request failed");
  }

  window.fmstarStudioEngine = {
    _referenceImage: null,
    setReferenceImage(dataUrl) {
      this._referenceImage = dataUrl || null;
      recordTelemetry("reference_image_set", { hasImage: Boolean(this._referenceImage) });
    },
    async run(payload, options = {}) {
      const endpoints = options.endpoints || ["/api/v1/studio/generate", "/api/generate"];
      const reqPayload = Object.assign({}, payload || {});
      if (!reqPayload.reference_image && (this._referenceImage || window.fmstarReferenceImageData)) {
        reqPayload.reference_image = this._referenceImage || window.fmstarReferenceImageData;
      }
      const cacheKey = JSON.stringify({ endpoints, payload: reqPayload });
      const cached = getCache(cacheKey);
      if (cached && !options.bypassCache) {
        recordTelemetry("cache_hit", { endpoints: endpoints[0] });
        return Object.assign({ _fromCache: true }, cached);
      }

      for (const ep of endpoints) {
        try {
          const baseUrl = typeof window.fmstarApiUrl === "function" ? window.fmstarApiUrl(ep) : ep;
          const data = await fetchWithSelfHeal(baseUrl, reqPayload, 1, options.timeoutMs || 20000);
          setCache(cacheKey, data);
          recordTelemetry("success", { endpoint: ep });
          return data;
        } catch (err) {
          recordTelemetry("endpoint_fallback", { endpoint: ep, error: String(err) });
        }
      }

      const fallbackResult = {
        ok: false,
        selfHealed: true,
        preview: "تم تفعيل وضع الشفاء الذاتي مؤقتاً: تعذر الوصول إلى نقاط التوليد الحالية، يُرجى التحقق من اتصال السيرفر أو إعادة المحاولة."
      };
      recordTelemetry("all_endpoints_failed", {});
      return fallbackResult;
    },
    getTelemetry() {
      try {
        return JSON.parse(localStorage.getItem("fmstar_studio_telemetry") || "[]");
      } catch (_) {
        return [];
      }
    }
  };
})();
</script>

(function() {
  function isSafeMediaUrl(url) {
    return typeof url === "string" && (/^https?:\/\//i.test(url) || url.startsWith("/") || url.startsWith("blob:"));
  }

  window.fmstarGenerateAndPreview = async function(payload = {}, options = {}) {
    const previewEl = options.previewSelector
      ? document.querySelector(options.previewSelector)
      : document.getElementById(options.previewId || "fmstar-studio-preview");
    const downloadEl = options.downloadSelector
      ? document.querySelector(options.downloadSelector)
      : document.getElementById(options.downloadBtnId || "fmstar-download-btn");

    if (downloadEl) {
      downloadEl.setAttribute("disabled", "disabled");
      downloadEl.disabled = true;
      downloadEl.dataset.ready = "0";
    }
    if (previewEl) {
      previewEl.textContent = "⏳ جاري التوليد وتجهيز المعاينة داخل الاستوديو...";
    }

    const body = Object.assign({ source: "fmstar-studio", preview_first: true }, payload || {});
    const engine = window.fmstarStudioEngine;
    const result = engine
      ? await engine.run(body, options)
      : { ok: false, selfHealed: true, preview: "محرك الاستوديو غير مهيأ بعد." };

    const previewText = result.preview || result.poem || result.result || result.structured_script || result.text || result.output || JSON.stringify(result, null, 2);
    if (previewEl) {
      previewEl.textContent = "";
      const textNode = document.createElement("div");
      textNode.textContent = String(previewText);
      previewEl.appendChild(textNode);

      const mediaUrl = result.audio_url || result.url;
      if (isSafeMediaUrl(mediaUrl)) {
        const audioEl = document.createElement("audio");
        audioEl.controls = true;
        audioEl.src = mediaUrl;
        audioEl.style.marginTop = "8px";
        audioEl.style.width = "100%";
        previewEl.appendChild(audioEl);
      }
    }

    const hasPreview = Boolean(previewText && !result.selfHealed && result.ok !== false);
    if (downloadEl && hasPreview) {
      downloadEl.removeAttribute("disabled");
      downloadEl.disabled = false;
      downloadEl.dataset.ready = "1";
      downloadEl.dataset.previewText = String(previewText);
      downloadEl.dataset.payload = JSON.stringify(result);
    }

    return result;
  };
})();
</script>
<script>
(function() {
  if (window.fmstarWireStudioUI) return;

  function ensureStudioBar() {
    if (document.getElementById("fmstar-live-studio-dock")) return;
    const dock = document.createElement("section");
    dock.id = "fmstar-live-studio-dock";
    dock.setAttribute("aria-label", "معاينة وتوليد الاستوديو");
    dock.style.cssText = [
      "position:fixed",
      "bottom:14px",
      "left:14px",
      "right:14px",
      "z-index:9999",
      "background:rgba(15,18,28,0.94)",
      "color:#f8fafc",
      "border:1px solid rgba(255,255,255,0.14)",
      "border-radius:14px",
      "padding:10px 12px",
      "box-shadow:0 10px 30px rgba(0,0,0,0.35)",
      "backdrop-filter:blur(8px)",
      "font-family:inherit"
    ].join(";");

    dock.innerHTML = `
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <input id="fmstar-live-prompt" type="text" placeholder="اكتبي فكرة قصيدة أو أغنية أو مقطع للمعاينة السريعة..."
          style="flex:1;min-width:190px;padding:8px 10px;border-radius:10px;border:1px solid rgba(255,255,255,0.18);background:#090b12;color:#fff;font-size:13px;" />
        <button id="fmstar-live-gen-btn" type="button"
          style="padding:8px 14px;border-radius:10px;border:none;background:#6366f1;color:#fff;font-weight:700;cursor:pointer;font-size:13px;">
          توليد ومعاينة
        </button>
        <button id="fmstar-live-dl-btn" type="button" disabled data-ready="0"
          style="padding:8px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.2);background:#1e293b;color:#cbd5e1;cursor:pointer;font-size:13px;">
          تنزيل النتيجة
        </button>
        <label for="fmstar-ref-image-input" id="fmstar-ref-image-label"
          style="cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;border:1px solid rgba(192,132,252,0.45);background:rgba(59,7,100,0.45);color:#f3e8ff;font-size:12px;">
          <span>إضافة صورة مرجعية</span>
        </label>
        <input id="fmstar-ref-image-input" type="file" accept="image/*" style="display:none;" />
      </div>
      <pre id="fmstar-live-preview"
        style="margin:8px 0 0;max-height:130px;overflow:auto;white-space:pre-wrap;background:#07090f;padding:8px 10px;border-radius:10px;font-size:12px;color:#e2e8f0;">جاهز للمعاينة داخل الاستوديو قبل التنزيل.</pre>
    `;

    document.body.appendChild(dock);

    const inputEl = document.getElementById("fmstar-live-prompt");
    const genBtn = document.getElementById("fmstar-live-gen-btn");
    const dlBtn = document.getElementById("fmstar-live-dl-btn");
    const refInput = document.getElementById("fmstar-ref-image-input");
    const refLabel = document.getElementById("fmstar-ref-image-label");

    window.fmstarReferenceImageData = window.fmstarReferenceImageData || null;
    window.fmstarHandleRefImage = function(input) {
      const file = input && input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        window.fmstarReferenceImageData = e.target.result;
        if (window.fmstarStudioEngine && typeof window.fmstarStudioEngine.setReferenceImage === "function") {
          window.fmstarStudioEngine.setReferenceImage(window.fmstarReferenceImageData);
        }
        if (refLabel) {
          refLabel.textContent = "✅ صورة مرجعية: " + file.name;
        }
      };
      reader.readAsDataURL(file);
    };

    if (refInput) {
      refInput.addEventListener("change", function() {
        window.fmstarHandleRefImage(refInput);
      });
    }

    if (genBtn) {
      genBtn.addEventListener("click", async () => {
        const promptVal = (inputEl && inputEl.value ? inputEl.value : "").trim() || "مقطع شعري قصير عن الإبداع والضوء";
        if (typeof window.fmstarGenerateAndPreview === "function") {
          await window.fmstarGenerateAndPreview(
            { prompt: promptVal },
            {
              endpoints: ["/api/v1/studio/generate", "/api/v1/audio/architect", "/api/fmstar/generate", "/api/generate"],
              previewSelector: "#fmstar-live-preview",
              downloadSelector: "#fmstar-live-dl-btn"
            }
          );
        }
      });
    }

    if (dlBtn) {
      dlBtn.addEventListener("click", () => {
        if (dlBtn.dataset.ready !== "1" || !dlBtn.dataset.previewText) return;
        const blob = new Blob([dlBtn.dataset.previewText], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "fmstar-studio-preview.txt";
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      });
    }
  }

  window.fmstarWireStudioUI = function() {
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", ensureStudioBar, { once: true });
    } else {
      ensureStudioBar();
    }
  };

  window.fmstarWireStudioUI();
})();
</script>
<script>
(function() {
  if (window.fmstarBindAllStudioButtons) return;

  window.fmstarBindAllStudioButtons = function() {
    const buttons = Array.from(document.querySelectorAll("button, [role='button']"));
    buttons.forEach((btn) => {
      if (btn.id === "fmstar-live-gen-btn" || btn.id === "fmstar-live-dl-btn") return;
      if (btn.dataset.fmstarBound === "1") return;
      const label = (btn.innerText || btn.textContent || "").trim();
      const isGenerateBtn = /(توليد|إنشاء|generate|معاينة|preview|شعر|أغنية|audio|song|poem)/i.test(label);
      if (!isGenerateBtn) return;

      btn.dataset.fmstarBound = "1";
      btn.addEventListener("click", async () => {
        const inputEl = document.getElementById("fmstar-live-prompt");
        const promptText = (inputEl && inputEl.value ? inputEl.value : "").trim() || label || "توليد إبداعي في FMStar AI Studio";
        if (typeof window.fmstarGenerateAndPreview === "function") {
          await window.fmstarGenerateAndPreview(
            { prompt: promptText, action: label },
            {
              endpoints: ["/api/v1/studio/generate", "/api/v1/audio/architect", "/api/fmstar/generate", "/api/generate"],
              previewSelector: "#fmstar-live-preview",
              downloadSelector: "#fmstar-live-dl-btn"
            }
          );
        }
      });
    });
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", () => setTimeout(window.fmstarBindAllStudioButtons, 300), { once: true });
  } else {
    setTimeout(window.fmstarBindAllStudioButtons, 300);
  }
})();
</script>
</body>
