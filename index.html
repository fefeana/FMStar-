<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FMStar AI - Cyberpunk Realm</title>
    
    <!-- 🛡️ حماية ميتا -->
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #020205; 
            --glass-bg: rgba(15, 15, 20, 0.65); 
            --primary-blue: #3b82f6;
            --neon-cyan: #00ffff; 
            --neon-pink: #ff00ff;
            --neon-yellow: #ffff00;
            --text-main: #f8fafc;
            --text-muted: #a1a1aa;
            --radius-lg: 16px;
            --radius-md: 10px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 110px;
            position: relative;
            overflow-x: hidden;
        }

        /* 🌌 خلفية السماء والنجوم */
        .star-sky {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            background: radial-gradient(circle at 50% 0%, #0d1025 0%, #020205 70%);
        }
        .star {
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            opacity: 0;
            animation: twinkle infinite alternate;
        }
        .golden-dust {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }
        .dust-particle {
            position: absolute;
            bottom: -10px;
            background: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 10px 2px rgba(0, 255, 255, 0.6);
            animation: floatUp linear infinite;
        }
        @keyframes twinkle { 0% { opacity: 0.2; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.2); } }
        @keyframes floatUp { 0% { transform: translateY(0) translateX(0); opacity: 0; } 10% { opacity: 0.8; } 90% { opacity: 0.8; } 100% { transform: translateY(-100vh) translateX(30px); opacity: 0; } }

        /* 🏷️ الهيدر */
        .header {
            width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: flex-start; padding: 20px; z-index: 10;
        }
        .brand-container { display: flex; flex-direction: column; gap: 2px; }
        .logo { 
            display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 26px; letter-spacing: -0.5px;
            background: linear-gradient(90deg, var(--neon-pink), var(--neon-cyan), var(--neon-yellow), var(--neon-pink));
            background-size: 300% 100%; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: hologram 3s linear infinite;
            filter: drop-shadow(1px 0px 0px rgba(255, 0, 0, 0.8)) drop-shadow(-1px 0px 0px rgba(0, 255, 255, 0.8));
        }
        .logo-icon { font-size: 22px; color: var(--neon-cyan); -webkit-text-fill-color: var(--neon-cyan); animation: pulseStar 1.5s infinite alternate; }
        @keyframes pulseStar { 0% { transform: scale(1); filter: drop-shadow(0 0 5px var(--neon-cyan)); } 100% { transform: scale(1.2); filter: drop-shadow(0 0 15px var(--neon-cyan)); } }
        .brand-subtitle { font-size: 9px; letter-spacing: 4px; color: var(--neon-cyan); text-transform: uppercase; text-shadow: 0 0 5px rgba(0, 255, 255, 0.5); margin-right: 30px; }
        @keyframes hologram { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }

        .login-btn {
            background: rgba(0, 0, 0, 0.5); color: var(--text-main); border: 1px solid var(--neon-cyan); padding: 6px 14px; border-radius: 20px; font-size: 11px; font-weight: 600; cursor: pointer; box-shadow: 0 0 10px rgba(0, 255, 255, 0.3); transition: 0.3s;
        }
        .login-btn:hover { box-shadow: 0 0 20px rgba(0, 255, 255, 0.8); }

        /* 📦 المحتوى الرئيسي */
        .main-container { width: 100%; max-width: 600px; padding: 0 16px; display: flex; flex-direction: column; gap: 12px; z-index: 10; }

        .glass-card {
            background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 255, 0.3); border-radius: var(--radius-lg); padding: 16px; position: relative; animation: neonBorder 3s infinite alternate;
        }
        @keyframes neonBorder {
            0% { box-shadow: 0 0 10px rgba(0, 255, 255, 0.2), inset 0 0 10px rgba(0, 255, 255, 0.1); border-color: rgba(0, 255, 255, 0.5); }
            50% { box-shadow: 0 0 15px rgba(255, 0, 255, 0.3), inset 0 0 10px rgba(255, 0, 255, 0.1); border-color: rgba(255, 0, 255, 0.5); }
            100% { box-shadow: 0 0 10px rgba(0, 255, 255, 0.2), inset 0 0 10px rgba(0, 255, 255, 0.1); border-color: rgba(0, 255, 255, 0.5); }
        }

        .hero-title {
            font-size: 26px; font-weight: 800; line-height: 1.1; margin-bottom: 6px; text-align: center; letter-spacing: -0.5px;
            background: linear-gradient(90deg, var(--neon-pink), var(--neon-cyan), var(--neon-yellow), var(--neon-pink));
            background-size: 300% 100%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: hologram 3s linear infinite;
            filter: drop-shadow(2px 0px 0px rgba(255, 0, 0, 0.7)) drop-shadow(-2px 0px 0px rgba(0, 255, 255, 0.7));
        }
        .hero-title span { -webkit-text-fill-color: transparent; }
        .hero-desc { color: var(--text-muted); font-size: 12px; margin-bottom: 14px; text-align: center; line-height: 1.4; }

        .input-group { margin-bottom: 10px; }
        .input-label { font-size: 11px; font-weight: 600; margin-bottom: 4px; display: block; color: #fff; text-shadow: 0 0 5px var(--neon-cyan); }
        .select-wrapper { position: relative; width: 100%; }
        .select-wrapper::after { content: '▼'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--neon-cyan); font-size: 8px; pointer-events: none; }

        .custom-select, .custom-textarea {
            width: 100%; background: rgba(0, 0, 0, 0.8); border: 1px solid #333; border-radius: var(--radius-md);
            padding: 10px; color: var(--text-main); font-family: 'Inter', sans-serif; font-size: 12px; outline: none; transition: 0.3s; scroll-margin-bottom: 120px;
        }
        .custom-select { appearance: none; -webkit-appearance: none; padding-left: 30px; cursor: pointer; }
        .custom-select:focus, .custom-textarea:focus { border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0, 255, 255, 0.4), inset 0 0 5px rgba(0, 255, 255, 0.2); }
        .custom-textarea { resize: none; height: 65px; }

        /* 📱 شبكة الأدوات */
        .tools-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 2px; }
        .tool-card {
            background: rgba(18, 18, 22, 0.9); backdrop-filter: blur(10px); border: 1px solid #333; border-radius: var(--radius-md); padding: 10px;
            display: flex; flex-direction: column; justify-content: space-between; min-height: 80px; cursor: pointer; transition: 0.3s;
        }
        .tool-card:hover, .tool-card:active { border-color: var(--neon-pink); box-shadow: 0 0 15px rgba(255, 0, 255, 0.3), inset 0 0 10px rgba(255, 0, 255, 0.1); }
        .tool-icon { font-size: 16px; margin-bottom: 2px; }
        .tool-title { font-weight: 800; font-size: 11px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; color: #fff; text-shadow: 1px 0px 0px rgba(255,0,0,0.5), -1px 0px 0px rgba(0,255,255,0.5); }
        .badge { font-size: 7px; background: var(--neon-cyan); color: #000; padding: 1px 4px; border-radius: 3px; font-weight: 800; box-shadow: 0 0 5px var(--neon-cyan); }
        .badge.blue { background: var(--neon-pink); box-shadow: 0 0 5px var(--neon-pink); }
        .tool-desc { color: var(--text-muted); font-size: 9px; line-height: 1.2; }

        /* 🔵 الزر السفلي الثابت */
        .fixed-bottom { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(5, 5, 7, 0.9); backdrop-filter: blur(20px); padding: 10px 16px; border-top: 1px solid rgba(0, 255, 255, 0.2); display: flex; justify-content: center; z-index: 100; }
        .btn-generate {
            width: 100%; max-width: 568px; background: linear-gradient(90deg, #2563eb, var(--neon-cyan), #2563eb); background-size: 200% auto;
            color: #000; border: none; padding: 12px; border-radius: var(--radius-md); font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 800;
            cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 8px; box-shadow: 0 0 15px rgba(0, 255, 255, 0.5); animation: btnGlow 2s infinite alternate;
        }
        @keyframes btnGlow { 0% { box-shadow: 0 0 10px rgba(0, 255, 255, 0.3); background-position: 0% center; } 100% { box-shadow: 0 0 25px rgba(255, 0, 255, 0.5); background-position: 100% center; } }
        .btn-generate:hover { transform: scale(1.02); }
        .btn-generate:disabled { opacity: 0.7; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="star-sky" id="starSky"></div>
    <div class="golden-dust" id="goldenDust"></div>

    <header class="header">
        <div class="brand-container">
            <div class="logo"><span class="logo-icon">✦</span> FMStar</div>
            <div class="brand-subtitle">AI STUDIO</div>
        </div>
        <button class="login-btn">Log in</button>
    </header>

    <main class="main-container">
        <div class="glass-card">
            <h1 class="hero-title">ENTER THE <span>CREATIVE</span><br>REALM</h1>
            <p class="hero-desc">Every top AI model in one studio. Turn your imagination into reality.</p>
            
            <div class="input-group">
                <label class="input-label">Select AI Creation Tool</label>
                <div class="select-wrapper">
                    <select id="toolSelect" class="custom-select">
                        <option value="video">🎬 Video Generation (Seedance 2.5)</option>
                        <option value="music">🎵 Music Generation (Kling 3.0)</option>
                        <option value="voice">🎙️ Vibe Voice (Microsoft MIT)</option>
                        <option value="poetry">📜 Poetry Creation (Gemini)</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">Describe your imagination</label>
                <textarea id="promptInput" class="custom-textarea" placeholder="Example: A cinematic video of a poet..."></textarea>
            </div>
        </div>

        <div class="tools-grid">
            <div class="tool-card" onclick="selectTool('video')">
                <div><div class="tool-icon">🎬</div><div class="tool-title">Video Gen <span class="badge blue">TOP</span></div></div>
                <div class="tool-desc">Most advanced video model</div>
            </div>
            <div class="tool-card" onclick="selectTool('voice')">
                <div><div class="tool-icon">🎙️</div><div class="tool-title">Vibe Voice <span class="badge">NEW</span></div></div>
                <div class="tool-desc">Microsoft's open-source</div>
            </div>
            <div class="tool-card" onclick="selectTool('poetry')">
                <div><div class="tool-icon">📜</div><div class="tool-title">Poetry Engine</div></div>
                <div class="tool-desc">Poems in 17 dialects</div>
            </div>
            <div class="tool-card" onclick="selectTool('music')">
                <div><div class="tool-icon">🎵</div><div class="tool-title">Music Studio</div></div>
                <div class="tool-desc">Create hit songs</div>
            </div>
        </div>
    </main>

    <div class="fixed-bottom">
        <button id="generateBtn" class="btn-generate" onclick="generateAI()">
            ✨ Generate Now
        </button>
    </div>

    <script>
        // 🌟 تأثيرات النجوم والغبار
        const starSky = document.getElementById('starSky');
        for (let i = 0; i < 40; i++) {
            const star = document.createElement('div'); star.className = 'star';
            star.style.width = `${Math.random() * 2 + 1}px`; star.style.height = star.style.width;
            star.style.top = `${Math.random() * 100}%`; star.style.left = `${Math.random() * 100}%`;
            star.style.animationDuration = `${Math.random() * 2 + 1}s`; star.style.animationDelay = `${Math.random() * 2}s`;
            starSky.appendChild(star);
        }
        const goldenDust = document.getElementById('goldenDust');
        for (let i = 0; i < 15; i++) {
            const dust = document.createElement('div'); dust.className = 'dust-particle';
            const size = Math.random() * 3 + 1; dust.style.width = `${size}px`; dust.style.height = `${size}px`;
            dust.style.left = `${Math.random() * 100}%`; dust.style.animationDuration = `${Math.random() * 5 + 5}s`;
            dust.style.animationDelay = `${Math.random() * 5}s`; goldenDust.appendChild(dust);
        }

        // 🛠️ اختيار الأداة
        function selectTool(tool) {
            document.getElementById('toolSelect').value = tool;
            const cards = document.querySelectorAll('.tool-card');
            cards.forEach(c => c.style.borderColor = '#333');
            event.currentTarget.style.borderColor = 'var(--neon-pink)';
        }

        // 🚀 ربط زر التوليد بالـ Backend (Render)
        async function generateAI() {
            const btn = document.getElementById('generateBtn');
            const promptInput = document.getElementById('promptInput');
            const promptText = promptInput.value;

            if (!promptText.trim()) {
                alert("اكتب فكرة المشهد أولاً يا ساموراي!");
                return;
            }

            const originalText = btn.innerHTML;
            btn.innerHTML = "⏳ Connecting & Generating...";
            btn.disabled = true;

            // 🎯 الرابط الخاص بك على Render (تم دمجه تلقائياً)
            const RENDER_URL = "https://fmstar-ai-studio.onrender.com/v1/audio/generations";

            try {
                const response = await fetch(RENDER_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-FMStar-Key": "samurai_secret_2026"
                    },
                    body: JSON.stringify({
                        prompt: promptText,
                        ratio: "16:9",
                        dsp_profile: "hybrid"
                    })
                });

                if (!response.ok) throw new Error("السيرفر رفض الطلب.");

                const data = await response.json();
                
                alert(`🎉 تم التوليد بنجاح!\n\nالنموذج: ${data.model_used}\nالنص المحسن: ${data.optimized_prompt}`);

            } catch (error) {
                console.error(error);
                alert("⚠️ لم نتمكن من الاتصال بالمحرك. قد يكون السيرفر في وضع النوم، انتظر 30 ثانية وحاول مرة أخرى.");
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
