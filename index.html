<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Star FM | AI Studio</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#050816;
color:white;
padding:20px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.lang{
padding:12px 25px;
border-radius:50px;
border:none;
background:#091c38;
color:white;
box-shadow:0 0 20px #00e5ff;
cursor:pointer;
}

.logo{
font-size:42px;
font-weight:900;
}

.logo span{
color:#ff00ff;
}

.studio{
padding:10px 20px;
border:1px solid #00e5ff;
color:#00e5ff;
border-radius:12px;
letter-spacing:2px;
}

.slider-card{

position:relative;

overflow:hidden;

border-radius:40px;

padding:15px;

background:
linear-gradient(
135deg,
#1a1442,
#10233f
);

border:2px solid #00d4ff;

box-shadow:
0 0 40px rgba(255,0,255,.3),
0 0 40px rgba(0,212,255,.3);

}

.slider-card img{
width:100%;
height:520px;
object-fit:cover;
border-radius:30px;
display:block;
}

.play-btn{

position:absolute;

left:35px;
bottom:120px;

width:90px;
height:90px;

border:none;
border-radius:50%;

font-size:35px;

cursor:pointer;

color:white;

background:
linear-gradient(
45deg,
#ff00ff,
#ff44cc
);

box-shadow:
0 0 35px #ff00ff;

}

.slide-title{

position:absolute;

bottom:120px;

right:30px;

font-size:42px;

font-weight:900;

text-shadow:0 0 20px black;

}

.nav{

display:flex;
justify-content:center;
align-items:center;
gap:20px;
margin-top:20px;

}

.nav button{

width:55px;
height:55px;

border-radius:50%;
border:none;

background:#0f1229;

color:white;

font-size:25px;

cursor:pointer;

}

.counter{
font-size:22px;
}

.generator{

margin-top:25px;

background:rgba(130,87,255,.15);

border-radius:30px;

padding:20px;

backdrop-filter:blur(12px);

}

textarea{

width:100%;
height:150px;

background:#13142a;

border:none;

outline:none;

color:white;

padding:15px;

border-radius:20px;

font-size:16px;

resize:none;

}

.generate{

width:100%;

margin-top:15px;

padding:16px;

border:none;

border-radius:20px;

font-size:18px;

font-weight:bold;

cursor:pointer;

color:white;

background:
linear-gradient(
90deg,
#6f42ff,
#ff00ff
);

}

</style>
</head>

<body>

<div class="header">

<button class="lang">
العربية
</button>

<div class="studio">
AI STUDIO
</div>

<div class="logo">
Star <span>FM</span>
</div>

</div>

<div class="slider-card">

<img id="slide"

src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=1200"

alt="">

<button class="play-btn">
▶
</button>

<div class="slide-title">
أثير النيون الفضائي
</div>

<div class="nav">

<button onclick="prevSlide()">
❮
</button>

<div id="count" class="counter">
1 / 3
</div>

<button onclick="nextSlide()">
❯
</button>

</div>

</div>

<div class="generator">

<textarea
placeholder="اكتب وصف الأغنية أو الشعر أو الفيديو ..."></textarea>

<button class="generate">
✨ توليد الأغنية • الشعر • الفيديو
</button>

</div>

<script>

const slides=[

"https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=1200",

"https://images.unsplash.com/photo-1516280440614-37939bbacd81?w=1200",

"https://images.unsplash.com/photo-1511379938547-c1f69419868d?w=1200"

];

let current=0;

function updateSlide(){

document.getElementById("slide").src=
slides[current];

document.getElementById("count").innerText=
(current+1)+" / "+slides.length;

}

function nextSlide(){

current++;

if(current>=slides.length){

current=0;

}

updateSlide();

}

function prevSlide(){

current--;

if(current<0){

current=slides.length-1;

}

updateSlide();

}

setInterval(nextSlide,5000);

</script>

</body>
    </html>
