<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جيمي وميرا استوديو | Gemini & Mira Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Tajawal', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="max-w-2xl w-full bg-slate-800 rounded-2xl shadow-2xl p-6 border border-slate-700">
        <div class="flex justify-between items-center mb-4">
            <a href="/" class="text-xs text-indigo-400 hover:text-white transition flex items-center gap-1 font-bold">
                ← العودة إلى منصة FMStar Studio
            </a>
            <div class="flex items-center gap-2">
                <span class="text-xs bg-emerald-900/60 text-emerald-300 px-2.5 py-1 rounded-full border border-emerald-700 font-mono">🛸 عام 30000 كوني</span>
                <span class="text-xs bg-rose-900/40 text-rose-300 px-2.5 py-1 rounded-full border border-rose-700">🚫 1970 حُظرت</span>
            </div>
        </div>
        <!-- العنوان -->
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-indigo-400 mb-2">🎙️ جيمي وميرا استوديو 🎵</h1>
            <p class="text-slate-400 text-sm">اكتب كلماتك واختر نوع الإنتاج الصوتي المطلوب</p>
        </div>

        <!-- صندوق كتابة النص -->
        <div class="mb-5">
            <label class="block text-slate-300 text-sm font-bold mb-2">أدخل النص أو الكلمات:</label>
            <textarea id="userInput" rows="5" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 text-white focus:outline-none focus:border-indigo-500 placeholder-slate-500 resize-none" placeholder="اكتب القصيدة، الخاطرة، أو كلمات الأغنية هنا..."></textarea>
        </div>

        <!-- خيارات قسم الشعر (تظهر عند فتح الخيارات) -->
        <div id="poetryOptions" class="mb-5 grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-slate-300 text-xs font-bold mb-1">اختر اللهجة / النمط الصوتي:</label>
                <select id="dialectSelect" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    
                    <!-- 1. اللهجات العربية المحلية والإقليمية -->
                    <optgroup label="🇾🇪 اليمن والجزيرة العربية">
                        <option value="yemeni_zamel">اليمن - زوامل وإلقاء حماسي</option>
                        <option value="yemeni_humayni">اليمن - شعر حميني وتراثي</option>
                        <option value="khaleeji_nabati">الخليج - شعر نبطي وشيلات</option>
                        <option value="khaleeji_classic">الخليج - إلقاء دافئ وهادئ</option>
                    </optgroup>

                    <optgroup label="🇸🇾 🇮🇶 🇱🇧 الشام والعراق">
                        <option value="iraqi_darami">العراق - دارمي وأبوذية (حزين/وجداني)</option>
                        <option value="syrian_zajal">سوريا - زجل وشعر شامي</option>
                        <option value="lebanese_romantic">لبنان - خواطر وإلقاء رومانسي</option>
                    </optgroup>

                    <optgroup label="🇪🇬 🇹🇳 🇩🇿 مصر والمغرب العربي">
                        <option value="egyptian_ammiya">مصر - شعر عامي ومسرحي</option>
                        <option value="maghrebi_malhoun">المغرب الكبير - شعر ملحون وموال</option>
                    </optgroup>

                    <!-- 2. الشعر العربي الفصيح (الكلاسيكي) -->
                    <optgroup label="📜 الشعر العربي الفصيح">
                        <option value="fus_ha_jahili">فصيح - إلقاء جاهلي ورصين (قوي)</option>
                        <option value="fus_ha_modern" selected>فصيح - شعر حديث وخواطر</option>
                    </optgroup>

                    <!-- 3. الأنماط واللغات العالمية -->
                    <optgroup label="🌍 الأنماط العالمية والثقافية">
                        <option value="turkish_dramatic">التركية - إلقاء درامي ورومانسي</option>
                        <option value="kurdish_folklore">الكردية - إلقاء جبالي وفلكلوري</option>
                        <option value="hindi_urdu_ghazal">الهندية / الأردو - غزل وخواطر</option>
                        <option value="russian_classic">الروسية - إلقاء كلاسيكي عميق</option>
                        <option value="asian_zen">الآسيوية (كوري/صيني) - شعر موزون وهادئ</option>
                        <option value="western_spoken_word">الغربية (إنجليزي) - Spoken Word إيقاعي</option>
                    </optgroup>

                </select>
            </div>
            <div>
                <label class="block text-slate-300 text-xs font-bold mb-1">طبيعة الصوت:</label>
                <select id="genderSelect" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    <option value="male">صوت رجالي</option>
                    <option value="female">صوت نسائي</option>
                </select>
            </div>
        </div>

        <!-- الأزرار الرئيسية -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-6">
            <button onclick="processRequest('song')" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition transform active:scale-95 flex items-center justify-center gap-2">
                <span>🎵</span> إنشاء أغنية
            </button>
            <button onclick="processRequest('poetry')" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition transform active:scale-95 flex items-center justify-center gap-2">
                <span>🎙️</span> إلقاء الشعر
            </button>
        </div>

        <!-- منطقة النتيجة والصوت -->
        <div id="resultContainer" class="mt-6 hidden p-4 bg-slate-900 rounded-xl border border-slate-700 text-center">
            <p id="statusText" class="text-sm text-indigo-400 mb-3">جاري معالجة الطلب...</p>
            <audio id="audioPlayer" controls class="w-full hidden"></audio>
        </div>
    </div>

    <script>
        function processRequest(mode) {
            const text = document.getElementById('userInput').value;
            const dialect = document.getElementById('dialectSelect').value;
            const gender = document.getElementById('genderSelect').value;

            if (!text.trim()) {
                alert("يرجى كتابة النص أولاً!");
                return;
            }

            const resultContainer = document.getElementById('resultContainer');
            const statusText = document.getElementById('statusText');
            resultContainer.classList.remove('hidden');

            if (mode === 'song') {
                statusText.innerText = "🎶 جاري إرسال الكلمات لاستوديو الألحان والموسيقى...";
            } else {
                statusText.innerText = `🎙️ جاري توليد الإلقاء الشعري بأسلوب (${dialect})...`;
            }

            // إرسال البيانات للـ Backend عبر API
            fetch('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mode, text, dialect, gender })
            })
            .then(res => res.json())
            .then(data => {
                statusText.innerText = "تم الإنتاج بنجاح! استمع للنتيجة:";
                const player = document.getElementById('audioPlayer');
                player.src = data.audio_url;
                player.classList.remove('hidden');
            })
            .catch(err => {
                statusText.innerText = "حدث خطأ أثناء المعالجة، يرجى المحاولة ثانية.";
            });
        }
    </script>
</body>
</html>
