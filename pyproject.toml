[project]
name = "gemini-mira-studio"
version = "0.1.0"
description = "Core backend services for AI generation & platform pipeline"
readme = "README.md"
requires-python = ">=3.10"

# مكتبات التشغيل الأساسية (Production)
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
]

# مكتبات التطوير والاختبار (Dev Dependencies)
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
