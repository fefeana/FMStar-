services:
  - type: web
    name: fmstar-backend-v2
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server_3000.py
    healthCheckPath: "/"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10
      - key: MCP_ENABLED
        value: "true"
      - key: MCP_EAGLE_SUPERSTARS
        value: "true"
      - key: MCP_SERVER_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: FMSTAR_SECRET_KEY
        sync: false
      - key: OMNIROUTE_API_KEY
        sync: false
      - key: OMNIROUTE_BASE_URL
        sync: false
